<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les boeken – La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.week-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.25rem 2rem;background:var(--beige);border-bottom:1px solid var(--border);flex-wrap:wrap;}
.week-title{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;font-style:italic;color:var(--espresso);}
.week-nav{display:flex;gap:.6rem;align-items:center;}
.kal-nb{height:36px;min-width:36px;padding:0 .9rem;border-radius:50px;background:white;border:1px solid var(--border);cursor:pointer;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;color:var(--espresso2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s,border-color .15s;}
.kal-nb.rond{padding:0;font-size:1.1rem;}
.kal-nb:hover:not(:disabled){background:var(--rose-d);color:white;border-color:var(--rose-d);}
.kal-nb:disabled{opacity:.35;cursor:not-allowed;}
.rooster-wrap{overflow:hidden;}

/* Weekraster (desktop) */
.rooster{display:grid;grid-template-columns:64px repeat(7,1fr);}
.r-head{padding:.8rem .4rem;text-align:center;border-bottom:1px solid var(--border);font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--espresso2);}
.r-head b{display:flex;align-items:center;justify-content:center;margin:3px auto 0;width:32px;height:32px;font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--espresso);letter-spacing:0;}
.r-head.today b{border-radius:50%;background:var(--rose-d);color:white;font-size:.95rem;box-shadow:0 4px 14px rgba(192,120,120,.4);}
.r-uur{font-size:.72rem;font-weight:700;color:var(--muted);padding:7px 8px 0 0;text-align:right;border-bottom:1px solid var(--border);border-right:1px solid var(--border);}
.r-cel{min-height:60px;padding:4px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);transition:background .2s;}
.r-cel:nth-child(8n){border-right:none;}
.r-cel:hover{background:rgba(251,240,238,.5);}
.slot{display:block;width:100%;text-align:left;border:none;border-left:3px solid var(--c);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 8px;margin-bottom:3px;font-family:'Nunito',sans-serif;font-size:.76rem;font-weight:800;cursor:pointer;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s;line-height:1.3;animation:slotIn .5s cubic-bezier(.22,1,.36,1) both;}
@keyframes slotIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:none;}}
.slot:hover:not(:disabled){transform:translateY(-3px) scale(1.02);box-shadow:0 10px 24px rgba(61,32,7,.14);}
.slot small{display:block;font-weight:600;opacity:.85;font-size:.68rem;}
.slot:disabled{cursor:not-allowed;opacity:.4;filter:grayscale(.7);}
.slot.mine{box-shadow:inset 0 0 0 1.5px var(--c);}
.slot .tag{float:right;font-size:.62rem;}
.rooster-foot{padding:1rem 2rem;background:var(--beige);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;}
.rooster-hint{font-size:.78rem;font-weight:600;color:var(--muted);}

/* Dagweergave (mobiel) */
.dag-lijst{display:none;padding:1.1rem;}
.dag-pills{display:flex;gap:.35rem;padding-bottom:.9rem;margin-bottom:.4rem;}
.dag-pill{flex:1 1 0;min-width:38px;border:1px solid var(--border);background:white;border-radius:14px;padding:.45rem .1rem;text-align:center;font-family:'Nunito',sans-serif;font-size:.66rem;font-weight:800;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .2s;}
.dag-pill b{display:block;font-family:'Playfair Display',serif;font-size:1rem;color:var(--espresso);text-transform:none;}
.dag-pill.active{background:var(--rose-d);border-color:var(--rose-d);color:white;box-shadow:0 4px 14px rgba(192,120,120,.35);}
.dag-pill.active b{color:white;}
.dag-lijst .slot{padding:.95rem 1.1rem;font-size:.95rem;margin-bottom:.65rem;border-radius:14px;}
.dag-lijst .slot small{font-size:.8rem;}
/* Zaalhuur (alleen zichtbaar voor professionals) */
.slot.zaal-vrij{background:transparent;border:1.5px dashed rgba(155,110,53,.35);border-left:1.5px dashed rgba(155,110,53,.35);color:var(--caramel);font-weight:700;opacity:.45;animation:none;}
.r-cel:hover .slot.zaal-vrij,.slot.zaal-vrij:focus-visible{opacity:1;}
.slot.zaal-vrij:hover{background:var(--bg);border-style:solid;opacity:1;}
.dag-lijst .slot.zaal-vrij{opacity:.85;}
.r-cel.gesloten{background:repeating-linear-gradient(135deg,rgba(61,32,7,.035) 0 8px,rgba(61,32,7,.075) 8px 16px);}
.r-cel.gesloten:hover{background:repeating-linear-gradient(135deg,rgba(61,32,7,.035) 0 8px,rgba(61,32,7,.075) 8px 16px);}
.gesloten-lbl{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:var(--muted);padding:6px 4px;}
.dag-gesloten{padding:.85rem 1.1rem;margin-bottom:.65rem;border-radius:14px;font-weight:800;font-size:.9rem;color:var(--muted);background:repeating-linear-gradient(135deg,rgba(61,32,7,.035) 0 8px,rgba(61,32,7,.075) 8px 16px);}
.legend-dot.gesloten .legend-pip{background:repeating-linear-gradient(135deg,rgba(61,32,7,.15) 0 3px,rgba(61,32,7,.35) 3px 6px);opacity:1;}
.zaal-hint{margin-bottom:1.5rem;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;}
.zaal-hint b{font-style:normal;}
.leeg{padding:2rem 1rem;text-align:center;color:var(--muted);font-family:'Playfair Display',serif;font-style:italic;}

/* Mijn reservaties */
.mijn{margin-top:2.5rem;padding:2rem;}
.res-rij{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;border-top:1px solid var(--border);flex-wrap:wrap;}
.res-rij:first-child{border-top:none;padding-top:0;}
.res-info{font-size:.95rem;color:var(--espresso2);}
.res-info b{color:var(--espresso);}
.status{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:50px;}
.status.wacht{background:var(--rose-pale);color:var(--rose-d);}
.status.betaald{background:var(--sage-pale);color:var(--sage);}
.res-acties{display:flex;align-items:center;gap:.8rem;}
.res-acties a{font-size:.85rem;color:var(--rose-d);font-weight:800;text-decoration:none;}
.res-acties a:hover{color:var(--espresso);}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(61,32,7,.45);backdrop-filter:blur(4px);z-index:950;display:none;align-items:center;justify-content:center;padding:1rem;}
.modal-bg.open{display:flex;animation:fade .25s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--vanilla);border-radius:24px;max-width:430px;width:100%;overflow:hidden;box-shadow:0 40px 100px rgba(61,32,7,.35);animation:pop .4s cubic-bezier(.22,1,.36,1);}
@keyframes pop{from{transform:translateY(24px) scale(.96);opacity:0;}to{transform:none;opacity:1;}}
.modal-top{padding:1.75rem 1.75rem 1.4rem;background:var(--bg);border-bottom:3px solid var(--c);position:relative;}
.modal-icon{font-size:2.2rem;}
.modal-soort{font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);margin-top:.5rem;}
.modal-title{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;font-style:italic;color:var(--espresso);margin-top:.15rem;}
.modal-sub{color:var(--espresso2);font-size:.92rem;margin-top:.25rem;}
.modal-close{position:absolute;top:1rem;right:1rem;width:34px;height:34px;border-radius:50%;border:none;background:rgba(253,248,238,.8);cursor:pointer;font-size:1rem;color:var(--espresso2);transition:background .2s,transform .2s;}
.modal-close:hover{background:var(--rose-d);color:white;transform:rotate(90deg);}
.modal-body{padding:1.4rem 1.75rem 1.75rem;}
.detail{display:flex;justify-content:space-between;font-size:.92rem;padding:.55rem 0;border-bottom:1px dashed var(--border);color:var(--espresso2);}
.detail b{color:var(--espresso);font-weight:700;}
.cap-bar{height:7px;border-radius:50px;background:rgba(61,32,7,.08);overflow:hidden;margin:1.1rem 0 .45rem;}
.cap-fill{height:100%;border-radius:50px;background:var(--c);transform-origin:left;animation:grow 1s cubic-bezier(.22,1,.36,1);}
@keyframes grow{from{transform:scaleX(0);}}
.cap-txt{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:1.3rem;}
.login-hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:.8rem;}

@media(max-width:900px){
  .rooster{display:none;}
  .dag-lijst{display:block;}
  .week-bar,.rooster-foot{padding:1rem 1.25rem;}
}
</style>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/boeken.js"></script>

<header class="page-hero" style="--ph-img:url('https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=1800&q=85');">
  <div class="ph-bg"></div><div class="ph-mid"></div>
  <div class="ph-inner">
    <a href="index.html#kalender" class="back-link">← Terug naar het rooster</a><br>
    <div class="ph-badge"><div class="badge-dot"></div>Les boeken · Online reserveren</div>
    <h1 class="ph-title">
      <span class="ph-word" style="animation-delay:.3s;">Kies</span> <span class="ph-word" style="animation-delay:.42s;">jouw</span>
      <span class="ph-word script" style="animation-delay:.54s;">moment</span>
    </h1>
    <p class="ph-desc">Klik op een uur in het rooster om je plaats te reserveren. Je meldt je eerst aan, daarna bevestig je en ga je verder naar betalen.</p>
  </div>
</header>
<div class="morph-divider"><svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path id="wavePath" d="M0,40 C240,80 480,0 720,40 C960,80 1200,0 1440,40 L1440,80 L0,80 Z" fill="#FDF8EE"/></svg></div>

<main>
  <section class="sec">
    <div class="blob" style="width:420px;height:420px;top:-80px;right:-140px;background:rgba(232,164,160,.14);"></div>
    <div class="blob" style="width:320px;height:320px;bottom:0;left:-120px;background:rgba(90,122,74,.08);"></div>
    <div class="inner">
      <div class="notice zaal-hint sr up" id="zaalHint" style="display:none;"></div>
      <div class="card rooster-wrap sr scale">
        <div class="week-bar">
          <div class="week-title" id="weekTitle"></div>
          <div class="week-nav">
            <button class="kal-nb rond" id="prevWeek" onclick="wijzigWeek(-1)" aria-label="Vorige week">&#8249;</button>
            <button class="kal-nb" onclick="naarVandaag()">Deze week</button>
            <button class="kal-nb rond" id="nextWeek" onclick="wijzigWeek(1)" aria-label="Volgende week">&#8250;</button>
          </div>
        </div>
        <div class="rooster" id="rooster"></div>
        <div class="dag-lijst" id="dagLijst"></div>
        <div class="rooster-foot">
          <div class="legend" id="legend"></div>
          <div class="rooster-hint">Grijze uren zijn voorbij of volzet.</div>
        </div>
      </div>

      <div class="card mijn sr up" id="mijnWrap" style="display:none;">
        <p class="eyebrow">Jouw planning</p>
        <h2 class="card-title">Mijn reservaties</h2>
        <div id="mijnLijst"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal-bg" id="modal" onclick="if(event.target===this)sluitModal()">
  <div class="modal" id="modalInhoud" role="dialog" aria-modal="true"></div>
</div>

<script>
var MAX_WEKEN_VOORUIT=4;
var huidigeMaandag=mondayOf(new Date());
var weekStart=huidigeMaandag;
var gekozenDag=(new Date().getDay()+6)%7; // 0 = maandag
var user=currentUser();

function mijnSlotIds(){
  if(!user)return {};
  var m={};getBookings().forEach(function(b){if(b.userId===user.id)m[b.slotId]=b;});return m;
}

function slotKnop(slot,mijn,i){
  var vrij=vrijePlaatsen(slot),voorbij=isVoorbij(slot),isMijn=!!mijn[slot.id];
  var tag=isMijn?'<span class="tag">✓ Geboekt</span>':voorbij?'':vrij<=0?'<span class="tag">Vol</span>':(slot.les.max>1&&vrij<=3)?'<span class="tag">Nog '+vrij+'</span>':'';
  return '<button class="slot les-'+slot.lesId+(isMijn?' mine':'')+'" style="animation-delay:'+(i*0.04)+'s" '+(voorbij?'disabled':'')+
    ' onclick="openSlot(\''+slot.id+'\')">'+tag+slot.les.icon+' '+esc(slot.les.naam)+
    '<small>'+slot.tijd+' – '+slot.eind+'</small></button>';
}

// Vrij uur in de zaal (alleen voor professionals die de zaal mogen huren)
function zaalKnop(slot,mijn,i){
  if(!slot||isVoorbij(slot))return '';
  if(mijn[slot.id])return '<button class="slot les-zaal mine" onclick="openSlot(\''+slot.id+'\')"><span class="tag">✓</span>🏠 Zaal gehuurd<small>'+slot.tijd+' – '+slot.eind+'</small></button>';
  if(vrijePlaatsen(slot)<=0)return '<button class="slot les-zaal" disabled>🏠 Zaal bezet<small>'+slot.tijd+' – '+slot.eind+'</small></button>';
  return '<button class="slot les-zaal zaal-vrij" onclick="openSlot(\''+slot.id+'\')">+ Zaal huren<small>'+slot.tijd+' – '+slot.eind+'</small></button>';
}

function render(){
  var eind=addDays(weekStart,6);
  document.getElementById('weekTitle').textContent=weekStart.getDate()+' '+MAANDEN[weekStart.getMonth()]+' – '+eind.getDate()+' '+MAANDEN[eind.getMonth()]+' '+eind.getFullYear();
  var weken=Math.round((weekStart-huidigeMaandag)/(7*864e5));
  document.getElementById('prevWeek').disabled=weken<=0;
  document.getElementById('nextWeek').disabled=weken>=MAX_WEKEN_VOORUIT;

  var mijn=mijnSlotIds(), vandaag=isoDate(new Date()), n=0;
  var dagen=[0,1,2,3,4,5,6].map(function(i){return addDays(weekStart,i);});
  var perDag=dagen.map(slotsVoorDag);
  var zaal=magZaalHuren(user);

  // Desktop: uren × dagen
  var h='<div class="r-head"></div>'+dagen.map(function(d){
    return '<div class="r-head'+(isoDate(d)===vandaag?' today':'')+'">'+DAGEN_KORT[d.getDay()]+'<b>'+d.getDate()+'</b></div>';
  }).join('');
  for(var u=UUR_START;u<=UUR_EINDE;u++){
    h+='<div class="r-uur">'+pad(u)+':00</div>';
    perDag.forEach(function(slots,di){
      var dicht=isGesloten(dagen[di],u*60,u*60+60),eerste=dicht&&!isGesloten(dagen[di],(u-1)*60,u*60);
      if(dicht){h+='<div class="r-cel gesloten">'+(eerste?'<div class="gesloten-lbl">🔒 Gesloten</div>':'')+'</div>';return;}
      h+='<div class="r-cel">'+slots.filter(function(s){return +s.tijd.slice(0,2)===u;}).map(function(s){return slotKnop(s,mijn,n++);}).join('')+
        (zaal?zaalKnop(zaalSlot(dagen[di],u),mijn,0):'')+'</div>';
    });
  }
  document.getElementById('rooster').innerHTML=h;

  // Mobiel: dag kiezen + lijst
  var m='<div class="dag-pills">'+dagen.map(function(d,i){
    return '<button class="dag-pill'+(i===gekozenDag?' active':'')+'" onclick="kiesDag('+i+')">'+DAGEN_KORT[d.getDay()]+'<b>'+d.getDate()+'</b></button>';
  }).join('')+'</div>';
  var items=perDag[gekozenDag].map(function(s){return {tijd:s.tijd,html:function(i){return slotKnop(s,mijn,i);}};});
  if(zaal)for(var zu=UUR_START;zu<=UUR_EINDE;zu++){(function(zs){if(zs)items.push({tijd:zs.tijd,html:function(i){return zaalKnop(zs,mijn,i);}});})(zaalSlot(dagen[gekozenDag],zu));}
  var dicht=geslotenVanaf(dagen[gekozenDag]);
  if(dicht)items.push({tijd:dicht,html:function(){return '<div class="dag-gesloten">🔒 Gesloten vanaf '+dicht+'</div>';}});
  items.sort(function(a,b){return a.tijd<b.tijd?-1:1;});
  var lijstHtml=items.map(function(it,i){return it.html(i);}).join('');
  m+=lijstHtml||'<div class="leeg">Geen lessen op deze dag.</div>';
  document.getElementById('dagLijst').innerHTML=m;

  renderMijn();
}

function renderMijn(){
  var wrap=document.getElementById('mijnWrap');
  if(!user){wrap.style.display='none';return;}
  var lijst=mijnBookings(user).filter(function(b){return !isVoorbij(b.slot);});
  wrap.style.display='block';
  document.getElementById('mijnLijst').innerHTML=lijst.length?lijst.map(function(b){
    var s=b.slot;var betaald=b.status==='betaald';
    return '<div class="res-rij"><div class="res-info"><b>'+s.les.icon+' '+esc(s.les.naam)+'</b> · '+fmtDatum(s.datum)+' om '+s.tijd+
      ' · '+b.plaatsen+' plaats'+(b.plaatsen>1?'en':'')+(b.voorWie?' · voor '+esc(b.voorWie):'')+'</div>'+
      '<div class="res-acties"><span class="status '+(betaald?'betaald':'wacht')+'">'+(betaald?'Betaald':'Wacht op betaling')+'</span>'+
      (betaald?'':'<a href="betalen.html?booking='+b.id+'">Betalen →</a>')+'</div></div>';
  }).join(''):'<div class="res-info">Je hebt nog geen komende reservaties. Klik op een uur in het rooster!</div>';
}

function openSlot(id){
  var s=parseSlot(id);if(!s)return;
  var bez=bezetting(s),vrij=s.les.max-bez,pct=Math.round(bez/s.les.max*100);
  var mijn=mijnSlotIds()[id];
  var knop;
  if(mijn){knop='<a class="btn btn-outline btn-block" href="'+(mijn.status==='betaald'?'boeken.html':'betalen.html?booking='+mijn.id)+'">'+(mijn.status==='betaald'?'✓ Je bent ingeschreven':'Je reservatie afronden →')+'</a>';}
  else if(vrij<=0){knop='<button class="btn btn-primary btn-block" disabled>Volzet</button>';}
  else{knop='<button class="btn btn-primary btn-block" onclick="reserveer(\''+id+'\')">'+(s.lesId==='zaal'?'🏠 Huur de zaal':'🌹 Reserveer dit uur')+'</button>'+
    (user?'':'<div class="login-hint">Je wordt eerst gevraagd om je aan te melden.</div>');}
  var cap=s.les.max>1
    ?'<div class="cap-bar"><div class="cap-fill" style="width:'+pct+'%"></div></div><div class="cap-txt">'+bez+' / '+s.les.max+' plaatsen bezet · '+(vrij>0?'nog '+vrij+' vrij':'volzet')+'</div>'
    :'<div class="cap-txt" style="margin-top:1rem;">'+(vrij>0?(s.lesId==='zaal'?'✓ De zaal is dit uur vrij — je begeleidt je eigen klant(en)':'✓ Dit uur is nog vrij'):'Dit uur is al geboekt')+'</div>';
  var el=document.getElementById('modalInhoud');
  el.className='modal les-'+s.lesId;
  el.innerHTML=
    '<div class="modal-top"><button class="modal-close" onclick="sluitModal()" aria-label="Sluiten">✕</button>'+
    '<div class="modal-icon">'+s.les.icon+'</div><div class="modal-soort">'+esc(s.les.soort)+'</div><div class="modal-title">'+esc(s.les.naam)+'</div>'+
    '<div class="modal-sub">'+fmtDatum(s.datum)+' · '+s.tijd+' – '+s.eind+'</div></div>'+
    '<div class="modal-body">'+
    '<div class="detail"><span>Begeleiding</span><b>'+esc(s.les.trainer)+'</b></div>'+
    '<div class="detail"><span>Duur</span><b>'+s.les.duur+' min</b></div>'+
    '<div class="detail"><span>Prijs'+(s.les.max>1?' per plaats':'')+'</span><b>'+fmtEuro(s.les.prijs)+'</b></div>'+
    cap+knop+'</div>';
  document.getElementById('modal').classList.add('open');
}
function sluitModal(){document.getElementById('modal').classList.remove('open');}

// Controle: eerst aanmelden, daarna naar het reserveerscherm.
function reserveer(id){
  var doel='reserveren.html?slot='+encodeURIComponent(id);
  location.href=currentUser()?doel:'login.html?next='+encodeURIComponent(doel);
}

function wijzigWeek(n){weekStart=addDays(weekStart,7*n);gekozenDag=0;render();}
function naarVandaag(){weekStart=huidigeMaandag;gekozenDag=(new Date().getDay()+6)%7;render();}
function kiesDag(i){gekozenDag=i;render();}
document.addEventListener('keydown',function(e){if(e.key==='Escape')sluitModal();});

document.getElementById('legend').innerHTML=Object.keys(LESSEN).map(function(k){
  return '<div class="legend-dot les-'+k+'"><div class="legend-pip"></div>'+esc(LESSEN[k].naam)+'</div>';
}).join('')+(magZaalHuren(user)?'<div class="legend-dot les-zaal"><div class="legend-pip"></div>Zaal huren</div>':'')+'<div class="legend-dot gesloten"><div class="legend-pip"></div>Gesloten</div>';

// Uitleg over zaalhuur voor professionals
(function(){
  var el=document.getElementById('zaalHint'),html='';
  if(!user)html='🏠 <span>Ben je <b>personal trainer, kinesist of lesgever</b>? <a href="login.html?next=boeken.html">Meld je aan</a> om een vrij uur in de zaal te huren voor je eigen klanten.</span>';
  else if(magZaalHuren(user))html='🏠 <span>Als '+esc(getType(user.type).label.toLowerCase())+' kan je elk vrij uur <b>de zaal huren</b> ('+fmtEuro(ZAAL.prijs)+'/uur). Klik op <b>+ Zaal huren</b> in het rooster.</span>';
  if(html){el.innerHTML=html;el.style.display='flex';}
})();
renderNav();
render();
</script>
</body>
