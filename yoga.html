<style>
/* Yoga reserveren (kleuren en onderdelen: assets/app.css) */
.yg{padding:calc(86px + env(safe-area-inset-top)) 18px 40px;}
.yg-wrap{max-width:560px;margin:0 auto;}
.yg-kop{margin:4px 0 20px;}
.yg-kop .a-sub{display:flex;align-items:center;gap:6px;}
.yg-titel{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--a-ink-3);margin:26px 0 10px;}
.yg-week{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:700;color:var(--a-ink);margin:22px 0 10px;}
.yg-week small{font-size:13px;font-weight:500;color:var(--a-ink-3);}
.kaart{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--a-radius-lg);padding:16px;margin-bottom:10px;box-shadow:var(--a-shadow);}
.kaart p+p{margin-top:8px;}
/* knoppen (namen blijven, kleuren uit app.css) */
.knop-groot{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 18px;margin-top:10px;border-radius:14px;border:1px solid transparent;font-family:var(--a-font);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;transition:background .15s,border-color .15s,transform .1s;}
.knop-groot:active{transform:scale(.98);}
.knop-groot.groen{background:var(--a-primary);color:#fff;}
.knop-groot.groen:hover{background:var(--a-primary-hover);}
.knop-groot.wit{background:var(--a-surface);color:var(--a-ink);border-color:var(--a-line-2);}
.knop-groot.rood{background:var(--a-danger);color:#fff;}
.knop-groot:disabled{opacity:.55;cursor:wait;}
.knop-groot:focus-visible,.knop-link:focus-visible,.veld input:focus-visible{outline:2px solid var(--a-accent);outline-offset:3px;}
.knop-link{display:inline-block;background:none;border:none;padding:10px 0;min-height:44px;font-family:var(--a-font);font-size:14.5px;font-weight:600;color:var(--a-accent);cursor:pointer;}
/* welkom en beurten */
.welkom h2{font-size:17px;font-weight:700;}
.welkom p{color:var(--a-ink-2);margin-top:4px;}
.welkom .knoppen{display:flex;flex-wrap:wrap;gap:0 8px;margin-top:6px;}
.welkom .knoppen .knop-groot{flex:1 1 200px;}
.saldo{display:flex;align-items:center;gap:14px;}
.saldo-getal{width:56px;height:56px;border-radius:16px;background:var(--a-ok-soft);color:var(--a-ok);display:flex;align-items:center;justify-content:center;font-family:var(--a-display);font-size:26px;font-weight:700;flex-shrink:0;}
.saldo.nul .saldo-getal{background:var(--a-danger-soft);color:var(--a-danger);}
.saldo-tekst b{display:block;font-size:16px;font-weight:700;}
.saldo-tekst span{display:block;color:var(--a-ink-3);font-size:13.5px;}
.wacht{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--a-warn-soft);color:var(--a-warn);font-weight:500;font-size:14px;}
.wacht .knop-link{color:var(--a-warn);padding:4px 0;min-height:0;}
/* lessen */
.les{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 14px;align-items:start;padding:16px;}
.les-tijd{grid-row:span 3;text-align:center;padding:8px 0;border-radius:12px;background:var(--a-surface-2);}
.les-tijd b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;}
.les-tijd span{display:block;font-size:12px;color:var(--a-ink-3);}
.les-dag{font-size:12.5px;font-weight:600;color:var(--a-ink-3);text-transform:uppercase;letter-spacing:.06em;}
.les-naam{font-size:16.5px;font-weight:700;line-height:1.3;}
.les-uur{font-size:14px;color:var(--a-ink-2);}
.les-stijl{display:none;}
.les-uitleg{font-size:13.5px;color:var(--a-ink-3);margin-top:2px;}
.les-voet{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:12px;border-top:1px solid var(--a-line);}
.les-bez{flex:1;min-width:0;}
.les-balk{height:5px;border-radius:5px;background:var(--a-surface-2);overflow:hidden;}
.les-balk i{display:block;height:100%;border-radius:5px;background:var(--a-ok);}
.les-balk.bijna i{background:var(--a-warn);}
.les-balk.vol i{background:var(--a-danger);}
.les-vrij{margin-top:5px;font-size:12.5px;font-weight:600;color:var(--a-ok);}
.les-vrij.bijna{color:var(--a-warn);}
.les-vrij.vol{color:var(--a-danger);}
.les-voet .knop-groot{width:auto;margin:0;min-height:42px;padding:0 18px;flex-shrink:0;}
.les.ingeschreven{border-color:rgba(59,106,56,.35);background:linear-gradient(0deg,rgba(231,239,226,.45),rgba(231,239,226,.45)),var(--a-surface);}
.les-ok{font-size:13px;font-weight:700;color:var(--a-ok);display:flex;align-items:center;gap:6px;}
.res{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.res .les-dag{color:var(--a-ok);}
.res .les-uur{color:var(--a-ink);font-weight:600;font-size:15px;}
.res .knop-groot{width:auto;margin:0;min-height:40px;padding:0 14px;font-size:14px;}
.leeg{color:var(--a-ink-3);text-align:center;padding:24px 0;}
/* venster onderaan */
.blad-bg{position:fixed;inset:0;background:rgba(20,12,6,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:1200;display:none;align-items:flex-end;justify-content:center;}
.blad-bg.open{display:flex;}
.blad{background:var(--a-surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;font-family:var(--a-font);font-size:15px;line-height:1.5;color:var(--a-ink);box-shadow:var(--a-shadow-lg);}
.blad::before{content:'';display:block;width:38px;height:4px;border-radius:4px;background:var(--a-line-2);margin:0 auto 16px;}
.blad h2{font-family:var(--a-display);font-size:24px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px;line-height:1.2;}
.blad p{margin-bottom:8px;color:var(--a-ink-2);}
.blad p b{color:var(--a-ink);}
.blad-les{display:flex;gap:14px;align-items:center;background:var(--a-surface-2);border-radius:14px;padding:14px;margin:12px 0 14px;font-size:14.5px;}
.blad-les .ic{width:42px;height:42px;border-radius:12px;background:var(--a-ok-soft);color:var(--a-ok);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.blad-les small{color:var(--a-ink-3);}
.blad-ok{width:60px;height:60px;border-radius:50%;background:var(--a-ok-soft);color:var(--a-ok);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:4px auto 12px;}
.blad-midden{text-align:center;}
.stappen-lijst{margin:6px 0 14px 20px;color:var(--a-ink-2);}
.stappen-lijst li{margin-bottom:6px;}
@media(min-width:700px){.blad-bg{align-items:center;padding:16px;}.blad{border-radius:24px;}.blad::before{display:none;}}
/* formulieren */
.veld{margin-bottom:14px;}
.veld label{display:block;font-weight:600;margin-bottom:6px;font-size:14px;}
.veld input{width:100%;min-height:48px;font-family:var(--a-font);font-size:16px;padding:10px 14px;border:1px solid var(--a-line-2);border-radius:12px;background:var(--a-surface);color:var(--a-ink);}
.veld input:focus{border-color:var(--a-ink-3);outline:none;box-shadow:0 0 0 3px rgba(176,93,89,.15);}
.veld .hint{font-size:13px;color:var(--a-ink-3);margin-top:5px;}
.pw{position:relative;}
.pw input{padding-right:84px;}
.pw button{position:absolute;right:6px;top:6px;bottom:6px;border:none;background:var(--a-surface-2);border-radius:9px;padding:0 12px;font-family:var(--a-font);font-size:13px;font-weight:600;color:var(--a-ink);cursor:pointer;}
.fout{color:var(--a-danger);font-weight:600;font-size:14px;min-height:1.2em;margin:4px 0;}
.scheiding{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--a-ink-3);font-size:13px;}
.scheiding::before,.scheiding::after{content:'';flex:1;height:1px;background:var(--a-line);}
/* hulp */
.yg-hulp{margin-top:28px;padding:18px;border-radius:var(--a-radius-lg);background:var(--a-surface-2);}
.yg-hulp h2{font-size:15.5px;font-weight:700;}
.yg-hulp p{color:var(--a-ink-2);font-size:14px;margin-top:2px;}
.klein{font-size:13.5px;color:var(--a-ink-3);margin-top:12px;}
.klein a,.klein .knop-link{color:var(--a-accent);font-weight:600;font-size:13.5px;padding:0;min-height:0;}
html.app-modus .yg{padding-top:calc(20px + env(safe-area-inset-top))!important;}
@media(prefers-reduced-motion:no-preference){.blad-bg.open .blad{animation:omhoog .28s cubic-bezier(.2,.8,.2,1);}@keyframes omhoog{from{transform:translateY(40px);opacity:.6;}to{transform:none;opacity:1;}}}
</style>

<body class="a" data-rustig>

<main class="yg">
  <div class="yg-wrap">
    <header class="yg-kop">
      <div class="a-eyebrow">Yoga met Gwen</div>
      <h1 class="a-titel">Reserveer je les</h1>
      <p class="a-sub">Kleine groepen · Hoogstraat 40, Aalst</p>
    </header>

    <div id="yg" aria-live="polite"><p class="leeg">Even geduld…</p></div>

    <section class="yg-hulp">
      <h2>Vragen over een les?</h2>
      <p>Gwen helpt je graag verder.</p>
      <a class="knop-groot wit" id="hulpWa" href="#" target="_blank" rel="noopener">Stuur Gwen een bericht</a>
      <p class="klein" id="ygWie"></p>
      <p class="klein"><a href="index.html">Naar de website van La Vie en Rose</a></p>
    </section>
  </div>
</main>

<div class="blad-bg" id="blad" role="dialog" aria-modal="true" aria-labelledby="bladTitel"><div class="blad" id="bladInhoud"></div></div>

<script>
/* ── GEGEVENS ── */
var user=null,saldo=0,aanvraag=null,weken=2,gekozen=null,bezig=false;
var MAX_WEKEN=6;
document.getElementById('hulpWa').href='https://wa.me/'+(LESSEN.yoga.whatsapp||REGELS.whatsapp)+'?text='+encodeURIComponent('Hallo! Ik heb een vraag over het reserveren van een yogales.');

function voornaam(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function dagLabel(d){
  var v=new Date();v.setHours(0,0,0,0);
  var verschil=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-v)/864e5);
  var t=DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()];
  return verschil===0?'Vandaag, '+t.toLowerCase():verschil===1?'Morgen, '+t.toLowerCase():t;
}
function weekLabel(d){
  var n=Math.round((mondayOf(d)-mondayOf(new Date()))/(7*864e5)),ma=mondayOf(d),zo=addDays(ma,6);
  var t=n===0?'Deze week':n===1?'Volgende week':'Over '+n+' weken';
  return t+' <small>('+ma.getDate()+' '+(ma.getMonth()!==zo.getMonth()?MAANDEN[ma.getMonth()]+' ':'')+'– '+zo.getDate()+' '+MAANDEN[zo.getMonth()]+')</small>';
}
// Komende lessen die met een beurt geboekt worden (yoga)
function lessen(){
  var r=[],v=new Date(),d=new Date(v.getFullYear(),v.getMonth(),v.getDate()),eind=addDays(mondayOf(v),weken*7);
  for(;d<eind;d=addDays(d,1))slotsVoorDag(d).forEach(function(s){if(metBeurt(s.lesId)&&!isBinnenkort(s.lesId)&&!isTeLaat(s))r.push(s);});
  return r;
}
function mijnReservaties(){
  if(!user)return [];
  return mijnBookings(user).filter(function(b){return metBeurt(b.slot.lesId)&&!isVoorbij(b.slot);});
}
function reservatieVoor(slotId){return mijnReservaties().find(function(b){return b.slotId===slotId;});}
function kaartTekst(k){return 'Kaart met '+k.beurten+' beurten'+(k.prijs!=null?' · '+fmtEuro(k.prijs):'');}
function prijsZin(){
  var k=BEURTENKAART.kaarten[0];
  return k&&k.prijs!=null?'Een kaart met '+k.beurten+' beurten kost '+fmtEuro(k.prijs)+'.':'Vraag de prijs aan Gwen.';
}

function laad(){
  var nu=new Date(),tot=addDays(mondayOf(nu),MAX_WEKEN*7);
  return Promise.all([DB.laadBezetting(nu,tot),user?DB.laadMijn():null,user?DB.beurten.mijn():null]).then(function(r){
    if(r[2]){saldo=r[2].saldo||0;aanvraag=r[2].aanvraag||null;}
    teken();
  }).catch(function(e){
    document.getElementById('yg').innerHTML='<div class="kaart"><p><b>Er is geen verbinding.</b></p><p>'+esc(e)+'</p><button class="knop-groot groen" onclick="laad()">Probeer opnieuw</button></div>';
  });
}

/* ── PAGINA ── */
function teken(){
  var h='';
  if(!user){
    h+='<div class="kaart welkom"><h2>Welkom</h2><p>Meld je aan om een les te reserveren met je beurtenkaart.</p>'+
      '<div class="knoppen"><button class="knop-groot groen" onclick="toonAanmelden(\'aanmelden\')">Aanmelden</button>'+
      '<button class="knop-groot wit" onclick="toonAanmelden(\'nieuw\')">Nieuw? Maak een account</button></div></div>';
  }else h+=beurtenHtml();
  var mijn=mijnReservaties();
  if(mijn.length){
    h+='<h2 class="yg-titel">Je reservaties</h2>'+mijn.map(function(b){var s=b.slot;
      return '<div class="kaart res"><div><div class="les-dag">'+dagLabel(s.datum)+'</div><div class="les-uur">'+s.tijd+' – '+boekingEind(b,s)+' · '+esc(slotNaam(s))+'</div></div>'+
        '<button class="knop-groot wit" onclick="annuleerVraag(\''+b.id+'\')">Annuleren</button></div>';}).join('');
  }
  h+='<h2 class="yg-titel">Kies een les</h2>';
  var l=lessen(),week=null;
  if(!l.length)h+='<p class="leeg">Er zijn geen lessen in deze periode.</p>';
  l.forEach(function(s){
    var w=isoDate(mondayOf(s.datum));
    if(w!==week){week=w;h+='<div class="yg-week">'+weekLabel(s.datum)+'</div>';}
    h+=lesHtml(s);
  });
  if(weken<MAX_WEKEN)h+='<button class="knop-groot wit" onclick="weken+=2;teken()">Toon meer lessen</button>';
  document.getElementById('yg').innerHTML=h;
  document.getElementById('ygWie').innerHTML=user?'Aangemeld als <b>'+esc(user.naam)+'</b> · <button class="knop-link" onclick="afmelden()">Afmelden</button>':'';
}
function beurtenHtml(){
  var h='<div class="kaart"><div class="saldo'+(saldo<1?' nul':'')+'"><div class="saldo-getal" aria-hidden="true">'+saldo+'</div><div class="saldo-tekst">';
  if(saldo>0)h+='<b>'+(saldo===1?'1 beurt':saldo+' beurten')+' op je kaart</b><span>Elke les kost 1 beurt</span>';
  else h+='<b>Je hebt geen beurten</b><span>Koop een beurtenkaart bij Gwen om te reserveren</span>';
  h+='</div></div>';
  if(aanvraag)h+='<div class="wacht">Kaart van '+aanvraag.aantal+' beurten aangevraagd. Betaal bij Gwen; zodra zij bevestigt, staan je beurten hier. <button class="knop-link" onclick="intrekken()">Aanvraag intrekken</button></div>';
  else if(saldo<1)h+='<button class="knop-groot groen" onclick="kaartVraag()">Beurtenkaart aanvragen</button>';
  else if(saldo<=2)h+='<button class="knop-groot wit" onclick="kaartVraag()">Bijna op? Nieuwe kaart aanvragen</button>';
  return h+'</div>';
}
// Soort yoga (bv. "Yin yoga") met een korte uitleg, zodat je weet wat je kan verwachten
function stijlHtml(s){return s.stijl?'<div class="les-uitleg">'+esc(stijlUitleg(s.lesId,s.stijl))+'</div>':'';}
function lesHtml(s){
  var b=reservatieVoor(s.id),vrij=vrijePlaatsen(s),max=s.les.max,pct=Math.min(100,Math.round((max-vrij)/max*100));
  var h='<div class="kaart les'+(b?' ingeschreven':'')+'"><div class="les-tijd"><b>'+s.tijd+'</b><span>'+s.les.duur+' min</span></div>'+
    '<div class="les-dag">'+dagLabel(s.datum)+'</div>'+
    '<div class="les-naam">'+esc(s.stijl||'Yoga')+'</div>'+
    '<div class="les-uur">tot '+s.eind+' · met '+esc(voornaam(s.trainer))+'</div>'+stijlHtml(s)+
    '<div class="les-voet">';
  if(b)h+='<div class="les-ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Je bent ingeschreven</div>';
  else{
    var klas=vrij<=0?' vol':vrij<=3?' bijna':'';
    h+='<div class="les-bez"><div class="les-balk'+klas+'"><i style="width:'+pct+'%"></i></div><div class="les-vrij'+klas+'">'+
      (vrij<=0?'Volzet':vrij<=3?'Nog maar '+vrij+' plaats'+(vrij>1?'en':'')+' vrij!':'Nog '+vrij+' plaatsen vrij')+'</div></div>'+
      (vrij>0?'<button class="knop-groot groen" onclick="kies(\''+s.id+'\')">Reserveer</button>':'');
  }
  return h+'</div></div>';
}

/* ── VENSTER ONDERAAN ── */
var vorigeFocus=null;
function blad(html){
  vorigeFocus=document.activeElement;
  document.getElementById('bladInhoud').innerHTML=html;
  var b=document.getElementById('blad');b.classList.add('open');document.body.style.overflow='hidden';
  var f=b.querySelector('[data-focus]')||b.querySelector('input,button');if(f)setTimeout(function(){f.focus();},50);
}
function sluitBlad(){
  document.getElementById('blad').classList.remove('open');document.body.style.overflow='';
  if(vorigeFocus&&vorigeFocus.focus&&document.body.contains(vorigeFocus))vorigeFocus.focus();
}
document.getElementById('blad').addEventListener('click',function(e){if(e.target===this&&!bezig)sluitBlad();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!bezig)sluitBlad();});
function lesBlok(s){return '<div class="blad-les"><div class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M4 12c3 0 5-2 8-2s5 2 8 2M12 10v5l-4 5M12 15l4 5"/></svg></div><div><b>'+dagLabel(s.datum)+'</b><br>'+s.tijd+' tot '+s.eind+'<br>'+esc(slotNaam(s))+' met '+esc(s.trainer)+(s.stijl?'<br><small>'+esc(stijlUitleg(s.lesId,s.stijl))+'</small>':'')+'</div></div>';}
function ok(titel,tekst){blad('<div class="blad-midden"><div class="blad-ok" aria-hidden="true">✓</div><h2 id="bladTitel">'+titel+'</h2>'+tekst+'</div><button class="knop-groot groen" data-focus onclick="sluitBlad()">OK</button>');}
function fout(e){
  var m=String(e||'');
  if(/geen beurten/i.test(m))return geenBeurten();
  blad('<h2 id="bladTitel">Dat lukte niet</h2><p>'+esc(m)+'</p><button class="knop-groot groen" data-focus onclick="sluitBlad()">OK</button>');
}
function wachtKnop(knop,tekst){bezig=true;knop.disabled=true;knop.textContent=tekst||'Even geduld…';}

/* ── RESERVEREN ── */
function kies(slotId){
  var s=parseSlot(slotId);
  if(!s||!metBeurt(s.lesId)||isTeLaat(s))return fout('Deze les kan je niet (meer) reserveren. Kies een andere les.');
  if(!user){gekozen=slotId;return toonAanmelden('aanmelden','Eerst even aanmelden, daarna reserveren we je les.');}
  if(reservatieVoor(slotId))return ok('Je bent al ingeschreven','<p>Voor deze les heb je al een plaats.</p>');
  if(vrijePlaatsen(s)<=0)return fout('Deze les is volzet. Kies een andere les.');
  if(saldo<1)return geenBeurten();
  blad('<h2 id="bladTitel">Les reserveren</h2>'+lesBlok(s)+
    '<p>Dit kost <b>1 beurt</b>. Daarna heb je er nog <b>'+(saldo-1)+'</b>.</p>'+
    '<button class="knop-groot groen" data-focus id="jaKnop">Ja, reserveer</button>'+
    '<button class="knop-groot wit" onclick="sluitBlad()">Nee, terug</button>');
  document.getElementById('jaKnop').onclick=function(){reserveer(s,this);};
}
function reserveer(s,knop){
  wachtKnop(knop,'Even geduld…');
  DB.maakBoeking(s,s.les.duur,'','').then(laad).then(function(){
    bezig=false;
    ok('Gelukt!','<p>Je bent ingeschreven voor '+esc(s.stijl||'yoga')+' op<br><b>'+dagLabel(s.datum).toLowerCase()+' om '+s.tijd+'</b>.</p><p>Je hebt nog '+(saldo===1?'1 beurt':saldo+' beurten')+'.</p>');
  }).catch(function(e){bezig=false;laad();fout(e);});
}
function annuleerVraag(id){
  var b=getBookings().find(function(x){return x.id===id;});if(!b)return laad();
  var s=parseSlot(b.slotId,true);
  if(!magZelfAnnuleren(b,s)){
    return blad('<h2 id="bladTitel">Annuleren kan niet meer online</h2>'+lesBlok(s)+
      '<p>Je les begint binnen '+REGELS.annulerenTotUurVooraf+' uur. Kan je toch niet komen? Laat het ons weten:</p>'+
      '<a class="knop-groot groen" href="'+waAnnuleerLink(b,s)+'" target="_blank" rel="noopener">Stuur een bericht</a>'+
      '<button class="knop-groot wit" data-focus onclick="sluitBlad()">Sluiten</button>');
  }
  blad('<h2 id="bladTitel">Les annuleren?</h2>'+lesBlok(s)+'<p>Je krijgt je beurt terug.</p>'+
    '<button class="knop-groot rood" id="annKnop">Ja, annuleer</button>'+
    '<button class="knop-groot wit" data-focus onclick="sluitBlad()">Nee, ik kom wel</button>');
  document.getElementById('annKnop').onclick=function(){
    wachtKnop(this);
    DB.annuleer(id).then(laad).then(function(){bezig=false;ok('Geannuleerd','<p>Je beurt staat terug op je kaart.</p>');})
      .catch(function(e){bezig=false;laad();fout(e);});
  };
}

/* ── BEURTENKAART ── */
function geenBeurten(){
  if(aanvraag)return blad('<h2 id="bladTitel">Nog even wachten</h2><p>Je beurtenkaart is aangevraagd, maar Gwen heeft je betaling nog niet bevestigd.</p><p>Betaal bij Gwen. Daarna kan je meteen reserveren.</p><button class="knop-groot groen" data-focus onclick="sluitBlad()">OK</button>');
  blad('<h2 id="bladTitel">Je hebt geen beurten</h2><p>Om een les te reserveren heb je een beurtenkaart nodig. Die koop je bij Gwen, voor of na de les.</p>'+
    '<button class="knop-groot groen" data-focus onclick="kaartVraag()">Beurtenkaart aanvragen</button>'+
    '<button class="knop-groot wit" onclick="sluitBlad()">Terug</button>');
}
function kaartVraag(){
  blad('<h2 id="bladTitel">Beurtenkaart aanvragen</h2><p>Zo werkt het:</p><ol class="stappen-lijst">'+
    '<li>Tik hieronder op de kaart.</li><li>Betaal bij Gwen, voor of na de les. '+prijsZin()+'</li><li>Gwen bevestigt je betaling. Je beurten staan dan hier en je kan reserveren.</li></ol>'+
    BEURTENKAART.kaarten.map(function(k,i){return '<button class="knop-groot groen"'+(i?'':' data-focus')+' onclick="kaartAanvragen('+k.beurten+',this)">'+kaartTekst(k)+'</button>';}).join('')+
    '<button class="knop-groot wit" onclick="sluitBlad()">Nee, terug</button>');
}
function kaartAanvragen(n,knop){
  wachtKnop(knop);
  DB.beurten.aanvragen(n).then(laad).then(function(){bezig=false;
    ok('Aangevraagd','<p>Betaal bij Gwen, voor of na de les.</p><p>Zodra zij je betaling bevestigt, staan je '+n+' beurten hier en kan je reserveren.</p>');
  }).catch(function(e){bezig=false;fout(e);});
}
function intrekken(){
  blad('<h2 id="bladTitel">Aanvraag intrekken?</h2><p>Je vraagt dan geen beurtenkaart meer aan.</p>'+
    '<button class="knop-groot rood" id="intrekKnop">Ja, intrekken</button><button class="knop-groot wit" data-focus onclick="sluitBlad()">Nee, terug</button>');
  document.getElementById('intrekKnop').onclick=function(){wachtKnop(this);DB.beurten.intrekken().then(laad).then(function(){bezig=false;sluitBlad();showToast('Aanvraag ingetrokken');}).catch(function(e){bezig=false;fout(e);});};
}

/* ── AANMELDEN / ACCOUNT MAKEN ── */
function wwVeld(id,auto){
  return '<div class="pw"><input type="password" id="'+id+'" autocomplete="'+auto+'" required minlength="6">'+
    '<button type="button" onclick="var i=document.getElementById(\''+id+'\');i.type=i.type===\'password\'?\'text\':\'password\';this.textContent=i.type===\'password\'?\'Toon\':\'Verberg\';">Toon</button></div>';
}
var MAILVELD='type="email" inputmode="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required';
function toonAanmelden(modus,intro){
  var h;
  if(modus==='nieuw'){
    h='<h2 id="bladTitel">Account maken</h2><p>Dat is gratis en duurt maar even.</p><form id="fNieuw" novalidate>'+
      '<div class="veld"><label for="nNaam">Je naam</label><input id="nNaam" autocomplete="name" autocapitalize="words" required placeholder="Voornaam en achternaam"></div>'+
      '<div class="veld"><label for="nMail">Je e-mailadres</label><input id="nMail" '+MAILVELD+'></div>'+
      '<div class="veld"><label for="nPw">Kies een wachtwoord</label>'+wwVeld('nPw','new-password')+'<div class="hint">Minstens 6 tekens. Schrijf het gerust op.</div></div>'+
      '<div class="fout" id="aFout" role="alert"></div><button class="knop-groot groen" id="aKnop">Account maken</button></form>'+
      '<div class="scheiding">of</div><button class="knop-groot wit" onclick="toonAanmelden(\'aanmelden\')">Ik heb al een account</button>';
  }else if(modus==='vergeten'){
    h='<h2 id="bladTitel">Wachtwoord vergeten</h2><p>Vul je e-mailadres in. Je krijgt een e-mail met een knop om een nieuw wachtwoord te kiezen.</p><form id="fVergeten" novalidate>'+
      '<div class="veld"><label for="vMail">Je e-mailadres</label><input id="vMail" '+MAILVELD+'></div>'+
      '<div class="fout" id="aFout" role="alert"></div><button class="knop-groot groen" id="aKnop">Stuur me de e-mail</button></form>'+
      '<button class="knop-groot wit" onclick="toonAanmelden(\'aanmelden\')">Terug</button>';
  }else{
    h='<h2 id="bladTitel">Aanmelden</h2><p>'+(intro||'Meld je aan met je e-mailadres en wachtwoord. Daarna blijf je aangemeld op deze gsm.')+'</p><form id="fAan" novalidate>'+
      '<div class="veld"><label for="aMail">Je e-mailadres</label><input id="aMail" '+MAILVELD+'></div>'+
      '<div class="veld"><label for="aPw">Je wachtwoord</label>'+wwVeld('aPw','current-password')+'</div>'+
      '<div class="fout" id="aFout" role="alert"></div><button class="knop-groot groen" id="aKnop">Aanmelden</button></form>'+
      '<button class="knop-link" onclick="toonAanmelden(\'vergeten\')">Wachtwoord vergeten?</button>'+
      '<div class="scheiding">Nog geen account?</div><button class="knop-groot wit" onclick="toonAanmelden(\'nieuw\')">Maak een account</button>';
  }
  blad(h+'<button class="knop-link" onclick="gekozen=null;sluitBlad()">Annuleren</button>');
  var f=document.querySelector('#bladInhoud form');
  f.addEventListener('submit',function(e){e.preventDefault();verstuur(modus);});
}
function verstuur(modus){
  var foutEl=document.getElementById('aFout'),knop=document.getElementById('aKnop'),tekst=knop.textContent;
  var waarde=function(id){var el=document.getElementById(id);return el?el.value.trim():'';};
  var mail=waarde(modus==='nieuw'?'nMail':modus==='vergeten'?'vMail':'aMail');
  foutEl.textContent='';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){foutEl.textContent='Vul een geldig e-mailadres in, bijvoorbeeld naam@gmail.com.';return;}
  var klaarMet=function(){bezig=false;knop.disabled=false;knop.textContent=tekst;};
  if(modus==='vergeten'){
    wachtKnop(knop);
    return DB.wachtwoordVergeten(mail).then(function(){bezig=false;ok('Kijk in je mailbox','<p>We stuurden een e-mail naar <b>'+esc(mail)+'</b>. Tik op de knop in die e-mail om een nieuw wachtwoord te kiezen.</p><p>Niets gekregen? Kijk ook bij "ongewenste e-mail".</p>');})
      .catch(function(e){klaarMet();foutEl.textContent=e;});
  }
  var pw=document.getElementById(modus==='nieuw'?'nPw':'aPw').value;
  if(modus==='nieuw'&&waarde('nNaam').length<2){foutEl.textContent='Vul je naam in.';return;}
  if(pw.length<6){foutEl.textContent=modus==='nieuw'?'Kies een wachtwoord van minstens 6 tekens.':'Vul je wachtwoord in.';return;}
  wachtKnop(knop);
  var p=modus==='nieuw'?DB.registreer(waarde('nNaam'),mail,'lid',pw,'yoga.html'+(gekozen?'?les='+encodeURIComponent(gekozen):'')):DB.login(mail,pw).then(function(u){return {user:u};});
  p.then(function(r){
    if(r&&r.bevestigen){
      bezig=false;
      return ok('Kijk in je mailbox','<p>We stuurden een e-mail naar <b>'+esc(mail)+'</b>.</p><p>Tik op de knop in die e-mail om je account te bevestigen. Daarna kom je vanzelf hier terug en kan je reserveren.</p><p>Niets gekregen? Kijk ook bij "ongewenste e-mail".</p>');
    }
    bezig=false;user=DB.user;nav();sluitBlad();
    return laad().then(function(){
      if(gekozen){var id=gekozen;gekozen=null;kies(id);}
      else showToast('Welkom, '+voornaam(user.naam)+'!');
    });
  }).catch(function(e){klaarMet();foutEl.textContent=e;});
}
function afmelden(){
  blad('<h2 id="bladTitel">Afmelden?</h2><p>Daarna moet je opnieuw aanmelden om te reserveren.</p>'+
    '<button class="knop-groot rood" onclick="logout()">Ja, afmelden</button><button class="knop-groot wit" data-focus onclick="sluitBlad()">Nee, blijf aangemeld</button>');
}

/* ── STARTEN ── */
// Menubalk: "Aanmelden" opent hier hetzelfde eenvoudige venster
function nav(){
  renderNav();
  var a=document.querySelector('#navRight a.nav-pill');
  if(a&&!user){a.textContent='Aanmelden';a.onclick=function(e){e.preventDefault();toonAanmelden('aanmelden');};}
}
klaar(function(u){
  user=u;nav();
  laad().then(function(){
    var les=new URLSearchParams(location.search).get('les');
    if(les){history.replaceState(null,'',location.pathname);kies(les);}
  });
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&window.DB&&!document.getElementById('blad').classList.contains('open'))laad();});
</script>
