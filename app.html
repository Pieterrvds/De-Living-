<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="De app van La Vie en Rose in Aalst: yoga reserveren met je beurtenkaart en het café huren voor je feest.">
<meta name="theme-color" content="#F7F3ED">
<title>La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/boeken.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="assets/db.js"></script>
<style>
/* Startscherm van de app (kleuren en onderdelen: assets/app.css) */
.st{padding:calc(86px + env(safe-area-inset-top)) 18px 32px;}
.st-wrap{max-width:560px;margin:0 auto;}
.st-kop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:2px 0 20px;}
.st-hallo small{display:block;font-size:14px;color:var(--a-ink-3);font-weight:500;}
.st-hallo h1{font-family:var(--a-display);font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em;}
.st-av{width:44px;height:44px;border-radius:50%;background:var(--a-accent-soft);color:var(--a-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;text-decoration:none;flex-shrink:0;}
/* volgende les: donkere kaart */
.st-les{position:relative;overflow:hidden;background:linear-gradient(150deg,#2A1B10 0%,#3C2615 100%);color:#FBF6EF;border-radius:var(--a-radius-lg);padding:20px;box-shadow:var(--a-shadow-lg);}
.st-les::after{content:'';position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(214,128,120,.35),transparent 70%);}
.st-les .kop{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E9B3AC;}
.st-les .wanneer{font-family:var(--a-display);font-size:26px;font-weight:700;margin-top:6px;line-height:1.15;}
.st-les .wat{margin-top:4px;color:rgba(251,246,239,.78);font-size:14.5px;}
.st-les .knoppen{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;}
.st-les .knoppen a{flex:1;min-height:42px;border-radius:12px;border:1px solid rgba(251,246,239,.22);background:rgba(251,246,239,.08);color:#FBF6EF;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600;text-decoration:none;}
.st-les .knoppen svg{width:17px;height:17px;}
.st-geen{border:1px dashed var(--a-line-2);border-radius:var(--a-radius-lg);padding:18px;color:var(--a-ink-2);font-size:14.5px;}
.st-geen b{display:block;color:var(--a-ink);font-size:15.5px;margin-bottom:2px;}
/* cijfers */
.st-cijfers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;}
.st-cijfer{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--a-radius);padding:14px 16px;text-decoration:none;color:inherit;box-shadow:var(--a-shadow);}
.st-cijfer b{display:block;font-family:var(--a-display);font-size:28px;line-height:1;}
.st-cijfer span{display:block;margin-top:6px;font-size:13px;color:var(--a-ink-3);font-weight:500;}
.st-cijfer.nul b{color:var(--a-danger);}
/* lijst met acties */
.st-lijst{background:var(--a-surface);border:1px solid var(--a-line);border-radius:var(--a-radius-lg);box-shadow:var(--a-shadow);overflow:hidden;}
.st-rij{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:inherit;}
.st-rij+.st-rij{border-top:1px solid var(--a-line);}
.st-rij:active{background:var(--a-surface-2);}
.st-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--a-surface-2);color:var(--a-ink);}
.st-ic.roos{background:var(--a-accent-soft);color:var(--a-accent);}
.st-ic.ok{background:var(--a-ok-soft);color:var(--a-ok);}
.st-ic svg{width:21px;height:21px;}
.st-rij .t{flex:1;min-width:0;}
.st-rij .t b{display:block;font-size:15.5px;font-weight:600;}
.st-rij .t span{display:block;font-size:13.5px;color:var(--a-ink-3);margin-top:1px;}
.st-rij .pijl{color:var(--a-ink-3);}
.st-rij .pijl svg{width:18px;height:18px;}
/* niet aangemeld */
.st-welkom{padding:22px;text-align:center;}
.st-roos{display:block;margin:2px auto 12px;width:64px;height:auto;}
.st-welkom p{color:var(--a-ink-2);margin-bottom:16px;}
.st-welkom .a-knop+.a-knop{margin-top:10px;}
/* contact */
.st-contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.st-contact a{min-height:64px;border-radius:var(--a-radius);background:var(--a-surface);border:1px solid var(--a-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;color:var(--a-ink);font-size:13px;font-weight:600;}
.st-contact svg{width:20px;height:20px;color:var(--a-accent);}
#meldVraag:not(:empty){margin-top:12px;}
.leeg{color:var(--a-ink-3);text-align:center;padding:2rem 0;}
html.app-modus .st{padding-top:calc(20px + env(safe-area-inset-top))!important;}
</style>
<script src="assets/splash.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/roos-32.png">
<link rel="apple-touch-icon" href="icons/roos-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Vie en Rose">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="assets/app.js" defer></script>
</head>
<body class="a" data-rustig>
<script src="assets/site.js"></script>

<main class="st">
  <div class="st-wrap" id="st" aria-live="polite"><p class="leeg">Even geduld…</p></div>
</main>

<script>
var IC={
  yoga:'<circle cx="12" cy="5" r="2"/><path d="M4 12c3 0 5-2 8-2s5 2 8 2M12 10v5l-4 5M12 15l4 5"/>',
  huren:'<path d="M8 3h8l-1 7a3 3 0 0 1-6 0z"/><path d="M12 13v7M8 21h8"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  route:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  bel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  wa:'<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 10c.5 2 2 3.5 4 4l1.2-1.2 1.8.8-.5 1.6c-3 .3-6.6-3.3-6.3-6.3l1.6-.5.8 1.8z"/>',
  kaart:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  instel:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  pijl:'<path d="M9 6l6 6-6 6"/>'
};
function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';}
var ADRES='Hoogstraat 40, 9308 Aalst';
var ROUTE='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('La Vie en Rose, '+ADRES);

function groet(){var u=new Date().getHours();return u<12?'Goedemorgen':u<18?'Goedemiddag':'Goedenavond';}
function voornaam(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function dagLabel(d){
  var v=new Date();v.setHours(0,0,0,0);
  var x=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-v)/864e5);
  var t=DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()];
  return x===0?'Vandaag':x===1?'Morgen':t;
}
// Eén les als agenda-bestand (.ics): werkt met de agenda van iPhone en Android
function agendaLink(b){
  var s=b.slot,eind=new Date(s.start.getTime()+boekingDuur(b,s)*60000);
  var f=function(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';};
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//La Vie en Rose//App//NL','BEGIN:VEVENT','UID:'+b.id+'@lavieenrose',
    'DTSTAMP:'+f(new Date()),'DTSTART:'+f(s.start),'DTEND:'+f(eind),'SUMMARY:'+slotNaam(s)+' – La Vie en Rose',
    'LOCATION:'+ADRES.replace(/,/g,'\\,'),'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Yoga binnen 2 uur','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function rij(href,ic,klas,titel,sub,extra){
  return '<a class="st-rij" href="'+href+'"'+(extra||'')+'><span class="st-ic '+(klas||'')+'">'+svg(ic)+'</span><span class="t"><b>'+titel+'</b><span>'+sub+'</span></span><span class="pijl">'+svg('pijl')+'</span></a>';
}
function teken(u,info){
  var h='<div class="a-merk"><img src="icons/roos-mark.svg" alt="" width="26" height="27"><span>La Vie <i>en Rose</i></span></div>'+'<div class="st-kop"><div class="st-hallo"><small>'+groet()+(u?',':'')+'</small><h1>'+(u?esc(voornaam(u.naam)||'welkom'):'Welkom')+'</h1></div>'+
    (u?'<a class="st-av" href="account.html" aria-label="Mijn account">'+esc(initialen(u.naam||u.email))+'</a>':'')+'</div>';
  if(!u){
    h+='<div class="a-kaart st-welkom"><img class="st-roos" src="icons/roos-mark.svg" alt="" width="64" height="67"><p>Reserveer je yogales met je beurtenkaart, volg je aanvragen en krijg een seintje voor je les.</p>'+
      '<a class="a-knop primair blok" href="login.html?next=app.html">Aanmelden</a><a class="a-knop tweede blok" href="login.html?tab=registreer&amp;next=app.html">Nieuw? Maak een account</a></div>';
  }else{
    var b=info.volgende;
    if(b){
      var s=b.slot;
      h+='<div class="st-les"><div class="kop">Je volgende les</div><div class="wanneer">'+dagLabel(s.datum)+', '+s.tijd+'</div>'+
        '<div class="wat">'+esc(slotNaam(s))+' · tot '+boekingEind(b,s)+' · met '+esc(voornaam(s.trainer))+'</div>'+
        '<div class="knoppen"><a href="'+agendaLink(b)+'" download="yoga.ics">'+svg('agenda')+'In mijn agenda</a>'+
        '<a href="'+ROUTE+'" target="_blank" rel="noopener">'+svg('route')+'Route</a></div></div>';
    }else if(info.geladen){
      h+='<div class="st-geen"><b>Nog geen les gepland</b>Kies een les in het rooster en reserveer met je beurtenkaart.</div>';
    }
    if(info.geladen){
      var saldo=info.saldo||0;
      h+='<div class="st-cijfers"><a class="st-cijfer'+(saldo<1?' nul':'')+'" href="yoga.html"><b>'+saldo+'</b><span>'+(saldo===1?'beurt':'beurten')+' op je kaart</span></a>'+
        '<a class="st-cijfer" href="account.html"><b>'+info.komend+'</b><span>'+(info.komend===1?'les':'lessen')+' gereserveerd</span></a></div>';
    }
  }
  h+='<div class="a-sectie"><h2>Ontdek</h2></div><div class="st-lijst">'+
    rij('yoga.html','yoga','ok','Yoga reserveren','Lessen met Gwen, deze en volgende week')+
    rij('huren.html','huren','roos','Café huren','Voor je feest, jubileum of vergadering')+'</div>';

  if(u&&info.aanvragen.length){
    h+='<div class="a-sectie"><h2>Je evenement</h2></div><div class="st-lijst">'+info.aanvragen.map(function(v){var d=new Date(v.start);
      return rij('huren.html','huren',v.status==='bevestigd'?'ok':'roos',esc(v.soort),(v.status==='bevestigd'?'Bevestigd':'Wacht op antwoord')+' · '+dagLabel(d).toLowerCase()+' om '+pad(d.getHours())+':'+pad(d.getMinutes()));}).join('')+'</div>';
  }
  if(u&&(magBeurtenBeheren(u)||u.isAdmin)){
    h+='<div class="a-sectie"><h2>Werk</h2></div><div class="st-lijst">'+
      (magBeurtenBeheren(u)?rij('beurten.html','kaart','','Beurtenkaarten','Betalingen bevestigen en deelnemers'):'')+
      (u.isAdmin?rij('beheer.html?tab=ev','instel','','Beheer','Reservaties, rooster en aanvragen'):'')+'</div>';
  }
  if(u)h+='<div id="meldVraag"></div>';
  h+='<div class="a-sectie"><h2>Contact</h2></div><div class="st-contact">'+
    '<a href="https://wa.me/'+REGELS.whatsapp+'" target="_blank" rel="noopener">'+svg('wa')+'WhatsApp</a>'+
    '<a href="tel:+'+REGELS.whatsapp+'">'+svg('bel')+'Bellen</a>'+
    '<a href="'+ROUTE+'" target="_blank" rel="noopener">'+svg('route')+'Route</a></div>';
  document.getElementById('st').innerHTML=h;
  // meldingen staan uit? vriendelijk voorstellen (tot "Niet nu")
  if(u&&window.Meldingen&&Meldingen.magVragen())Meldingen.toon('meldVraag',{enkelUit:true,nietNu:true});
}

klaar(function(u){
  var info={volgende:null,saldo:null,aanvragen:[],komend:0,geladen:false};
  if(!u){teken(null,info);return;}
  teken(u,info);   // meteen iets tonen, daarna aanvullen
  Promise.all([DB.laadMijn().catch(function(){}),DB.beurten.mijn().catch(function(){return null;}),DB.verhuur.mijn().catch(function(){return [];})]).then(function(r){
    var komend=mijnBookings(u).filter(function(b){return b.status!=='intern'&&!isVoorbij(b.slot);});
    info.volgende=komend[0]||null;info.komend=komend.length;info.geladen=true;
    info.saldo=r[1]?r[1].saldo||0:null;
    var nu=Date.now();
    info.aanvragen=(r[2]||[]).filter(function(v){return (v.status==='bevestigd'||v.status==='aangevraagd')&&new Date(v.eind).getTime()>nu;}).slice(-2);
    teken(u,info);
  });
});
</script>
</body>
</html>
