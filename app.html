<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="De app van La Vie en Rose in Aalst: yoga reserveren met je beurtenkaart en het café huren voor je feest.">
<meta name="theme-color" content="#FDF8EE">
<title>La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/boeken.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="assets/db.js"></script>
<style>
/* Startscherm van de app: groot, rustig en met één duim te bedienen */
.st{padding:88px 18px 2.5rem;font-size:1.125rem;line-height:1.5;color:#2E1A08;}
.st-wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:1rem;}
.st-hallo{margin-top:.25rem;}
.st-hallo small{display:block;font-size:1.05rem;color:#6E5641;}
.st-hallo h1{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;line-height:1.1;color:var(--espresso);}
.kaart{background:#fff;border:2px solid rgba(61,32,7,.12);border-radius:22px;padding:1.1rem 1.15rem;box-shadow:0 6px 24px rgba(61,32,7,.06);}
.kop{font-size:.88rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6E5641;margin-bottom:.35rem;}
.les-wanneer{font-size:1.35rem;font-weight:800;}
.les-wat{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.35rem;}
.pil{background:#EBF2E5;color:#2F5226;font-weight:800;border-radius:50px;padding:.2rem .8rem;font-size:1rem;}
.rij-knoppen{display:flex;gap:.6rem;margin-top:.85rem;}
.knop-rand{flex:1;min-height:50px;border-radius:14px;border:2px solid rgba(61,32,7,.3);background:#fff;color:#2E1A08;display:flex;align-items:center;justify-content:center;gap:.4rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:1rem;text-decoration:none;cursor:pointer;}
.groot{display:flex;align-items:center;gap:1rem;min-height:78px;padding:0 1.2rem;border-radius:20px;text-decoration:none;}
.groot svg{width:32px;height:32px;flex-shrink:0;}
.groot b{display:block;font-size:1.25rem;}
.groot span span{font-size:1rem;}
.groot.groen{background:#3F6B34;color:#fff;box-shadow:0 8px 20px rgba(63,107,52,.28);}
.groot.groen span span{opacity:.92;}
.groot.wit{background:#fff;color:#2E1A08;border:2px solid rgba(61,32,7,.15);}
.groot.wit svg{color:#A85F5F;}
.groot.wit span span{color:#6E5641;}
.groot:focus-visible,.knop-rand:focus-visible,.knop-groot:focus-visible{outline:3px solid #1D4ED8;outline-offset:3px;}
.knop-groot{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:.7rem;border-radius:16px;border:none;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;text-decoration:none;cursor:pointer;}
.knop-groot.groen{background:#3F6B34;color:#fff;}
.knop-groot.wit{background:#fff;color:#2E1A08;border:2px solid rgba(61,32,7,.35);}
.saldo{display:flex;align-items:center;gap:.9rem;}
.saldo-getal{width:60px;height:60px;border-radius:50%;background:#EBF2E5;color:#3F6B34;border:3px solid #3F6B34;display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;flex-shrink:0;}
.saldo.nul .saldo-getal{background:#FBF0EE;color:#9E3B3B;border-color:#9E3B3B;}
.st-titel{font-size:1.15rem;font-weight:800;margin-top:.5rem;}
.lijn{display:flex;justify-content:space-between;align-items:center;gap:.75rem;text-decoration:none;color:inherit;}
.lijn .pijl{font-size:1.4rem;color:#6E5641;}
.status{display:inline-block;font-weight:800;font-size:.9rem;padding:.15rem .7rem;border-radius:50px;margin-bottom:.3rem;}
.status.bevestigd{background:#EBF2E5;color:#2F5226;}
.status.aangevraagd{background:#FFF6E0;color:#8A5A12;}
.contact{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;}
.contact a{min-height:74px;border-radius:16px;background:#fff;border:2px solid rgba(61,32,7,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;text-decoration:none;color:#2E1A08;font-weight:800;font-size:.95rem;}
.contact svg{width:26px;height:26px;color:#3F6B34;}
.leeg{color:var(--espresso2);text-align:center;padding:1rem 0;}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Vie en Rose">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="assets/app.js" defer></script>
</head>
<body data-rustig>
<script src="assets/site.js"></script>

<main class="st">
  <div class="st-wrap" id="st" aria-live="polite"><p class="leeg">Even geduld…</p></div>
</main>

<script>
var IC={
  yoga:'<circle cx="12" cy="5" r="2"/><path d="M4 12c3 0 5-2 8-2s5 2 8 2M12 10v5l-4 5M12 15l4 5"/>',
  huren:'<path d="M8 3h8l-1 7a3 3 0 0 1-6 0z"/><path d="M12 13v7M8 21h8"/>',
  agenda:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  route:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  bel:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  wa:'<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 10c.5 2 2 3.5 4 4l1.2-1.2 1.8.8-.5 1.6c-3 .3-6.6-3.3-6.3-6.3l1.6-.5.8 1.8z"/>'
};
function svg(n){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';}
var ADRES='Hoogstraat 40, 9308 Aalst';
var ROUTE='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('La Vie en Rose, '+ADRES);

function groet(){var u=new Date().getHours();return u<12?'Goedemorgen':u<18?'Goedemiddag':'Goedenavond';}
function voornaam(n){return String(n||'').trim().split(/\s+/)[0]||'';}
function dagLabel(d){
  var v=new Date();v.setHours(0,0,0,0);
  var x=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-v)/864e5);
  var t=DAGEN[d.getDay()]+' '+d.getDate()+' '+MAANDEN[d.getMonth()];
  return x===0?'Vandaag':x===1?'Morgen':t;
}
// Eén les als agenda-bestand (.ics): werkt met de agenda van iPhone en Android
function agendaLink(b){
  var s=b.slot,eind=new Date(s.start.getTime()+boekingDuur(b,s)*60000);
  var f=function(d){return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';};
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//La Vie en Rose//App//NL','BEGIN:VEVENT','UID:'+b.id+'@lavieenrose',
    'DTSTAMP:'+f(new Date()),'DTSTART:'+f(s.start),'DTEND:'+f(eind),'SUMMARY:'+slotNaam(s)+' – La Vie en Rose',
    'LOCATION:'+ADRES.replace(/,/g,'\\,'),'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Yoga binnen 2 uur','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}

function teken(u,info){
  var h='<div class="st-hallo"><small>'+groet()+(u?',':'')+'</small><h1>'+(u?esc(voornaam(u.naam)||'welkom'):'Welkom bij La Vie en Rose')+'</h1></div>';
  if(!u){
    h+='<div class="kaart"><p>Meld je één keer aan. Daarna blijf je aangemeld en reserveer je met één tik.</p>'+
      '<a class="knop-groot groen" href="login.html?next=app.html">Aanmelden</a><a class="knop-groot wit" href="login.html?tab=registreer&amp;next=app.html">Nieuw? Maak een account</a></div>';
  }else{
    var b=info.volgende;
    if(b){
      var s=b.slot;
      h+='<div class="kaart"><div class="kop">Je volgende les</div><div class="les-wanneer">'+dagLabel(s.datum)+' · '+s.tijd+' – '+boekingEind(b,s)+'</div>'+
        '<div class="les-wat"><span class="pil">'+esc(slotNaam(s))+'</span><span>met '+esc(voornaam(s.trainer))+'</span></div>'+
        '<div class="rij-knoppen"><a class="knop-rand" href="'+agendaLink(b)+'" download="yoga.ics">'+svg('agenda').replace('<svg','<svg width="20" height="20"')+'In mijn agenda</a>'+
        '<a class="knop-rand" href="'+ROUTE+'" target="_blank" rel="noopener">'+svg('route').replace('<svg','<svg width="20" height="20"')+'Route</a></div></div>';
    }
  }
  var saldo=info.saldo;
  h+='<a class="groot groen" href="yoga.html">'+svg('yoga')+'<span><b>Yoga reserveren</b><span>'+
    (u&&saldo!=null?(saldo>0?'Nog '+saldo+(saldo===1?' beurt':' beurten')+' op je kaart':'Je hebt geen beurten meer'):'Met Gwen, in kleine groep')+'</span></span></a>';
  h+='<a class="groot wit" href="huren.html">'+svg('huren')+'<span><b>Café huren</b><span>Voor je feest of vergadering</span></span></a>';

  if(u&&info.aanvragen.length){
    h+='<div class="st-titel">Je feest</div>'+info.aanvragen.map(function(v){var d=new Date(v.start);
      return '<a class="kaart lijn" href="huren.html"><span><span class="status '+v.status+'">'+(v.status==='bevestigd'?'Bevestigd':'Wacht op antwoord')+'</span><br><b>'+esc(v.soort)+'</b> · '+dagLabel(d).toLowerCase()+' om '+pad(d.getHours())+':'+pad(d.getMinutes())+'</span><span class="pijl" aria-hidden="true">›</span></a>';}).join('');
  }
  if(u&&magBeurtenBeheren(u))h+='<a class="kaart lijn" href="beurten.html"><span><b>Beurtenkaarten</b><br><span style="color:#5C3314">Betalingen bevestigen en zien wie er komt</span></span><span class="pijl" aria-hidden="true">›</span></a>';
  if(u&&u.isAdmin)h+='<a class="kaart lijn" href="beheer.html?tab=ev"><span><b>Beheer</b><br><span style="color:#5C3314">Reservaties, rooster en aanvragen</span></span><span class="pijl" aria-hidden="true">›</span></a>';

  h+='<div class="st-titel">Contact</div><div class="contact">'+
    '<a href="https://wa.me/'+REGELS.whatsapp+'" target="_blank" rel="noopener">'+svg('wa')+'WhatsApp</a>'+
    '<a href="tel:+'+REGELS.whatsapp+'">'+svg('bel')+'Bellen</a>'+
    '<a href="'+ROUTE+'" target="_blank" rel="noopener">'+svg('route')+'Route</a></div>';
  if(u)h+='<div id="meldVraag"></div>';
  document.getElementById('st').innerHTML=h;
  // meldingen staan uit? vriendelijk voorstellen (tot "Niet nu")
  if(u&&window.Meldingen&&Meldingen.magVragen())Meldingen.toon('meldVraag',{enkelUit:true,nietNu:true});
}

klaar(function(u){
  var info={volgende:null,saldo:null,aanvragen:[]};
  if(!u){teken(null,info);return;}
  teken(u,info);   // meteen iets tonen, daarna aanvullen
  Promise.all([DB.laadMijn().catch(function(){}),DB.beurten.mijn().catch(function(){return null;}),DB.verhuur.mijn().catch(function(){return [];})]).then(function(r){
    info.volgende=mijnBookings(u).filter(function(b){return b.status!=='intern'&&!isVoorbij(b.slot);})[0]||null;
    info.saldo=r[1]?r[1].saldo||0:null;
    var nu=Date.now();
    info.aanvragen=(r[2]||[]).filter(function(v){return (v.status==='bevestigd'||v.status==='aangevraagd')&&new Date(v.eind).getTime()>nu;}).slice(-2);
    teken(u,info);
  });
});
</script>
</body>
</html>
