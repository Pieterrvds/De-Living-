<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Beheer – La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.page-hero{padding:8.5rem 2rem 4.5rem;}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.75rem;}
.tab{border:1.5px solid var(--border);background:var(--vanilla);color:var(--espresso2);font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:800;padding:.65rem 1.3rem;border-radius:50px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.5rem;}
.tab:hover{border-color:var(--rose-d);color:var(--rose-d);}
.tab.actief{background:var(--rose-d);border-color:var(--rose-d);color:white;box-shadow:0 4px 16px rgba(192,120,120,.35);}
.teller{background:var(--gold);color:white;border-radius:50px;font-size:.7rem;padding:1px 8px;}
.tab.actief .teller{background:white;color:var(--rose-d);}
.paneel{display:none;}
.paneel.actief{display:block;animation:in .35s cubic-bezier(.22,1,.36,1);}
@keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.balk{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.balk-l,.balk-r{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;}
.week-titel{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1.15rem;color:var(--espresso);}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.kpi{padding:1.1rem 1.25rem;}
.kpi b{display:block;font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--rose-d);line-height:1.1;}
.kpi span{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;}
.dag{margin-bottom:1.25rem;}
.dag-kop{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--rose-d);margin:0 0 .5rem .25rem;}
.rij{display:grid;grid-template-columns:110px 1.1fr 1.4fr auto;gap:1rem;align-items:center;padding:.9rem 1.25rem;border-bottom:1px solid var(--border);}
.rij:last-child{border-bottom:none;}
.rij .uur{font-weight:800;color:var(--espresso);}
.rij .wat{font-weight:700;color:var(--espresso);}
.rij .wie{font-size:.9rem;color:var(--espresso2);line-height:1.45;}
.rij .wie small,.rij .wat small{display:block;color:var(--muted);font-size:.78rem;font-weight:600;}
.rij .acties{display:flex;align-items:center;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;}
.status{font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:50px;white-space:nowrap;}
.status.wacht{background:var(--rose-pale);color:var(--rose-d);}
.status.bevestigd{background:rgba(184,134,42,.14);color:#946A1C;}
.status.betaald{background:var(--sage-pale);color:var(--sage);}
.status.intern{background:rgba(92,51,20,.1);color:var(--espresso2);}
.bedrag{font-weight:800;color:var(--espresso);min-width:70px;text-align:right;}
.leeg{padding:2.5rem;text-align:center;color:var(--muted);font-family:'Playfair Display',serif;font-style:italic;}
.lid{display:grid;grid-template-columns:minmax(0,1.3fr) 210px minmax(0,1fr);gap:1rem;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);}
.lid:last-child{border-bottom:none;}
.lid.wacht{background:rgba(251,240,238,.6);}
.lid .nm{font-weight:800;color:var(--espresso);}
.lid .em{font-size:.84rem;color:var(--muted);}
.lid .acties{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.zoek{height:38px;border-radius:50px;border:1.5px solid var(--border);background:var(--vanilla);padding:0 1rem;font-family:'Nunito',sans-serif;font-size:.9rem;min-width:220px;outline:none;}
.zoek:focus{border-color:var(--rose-d);}
.inst{padding:2rem;}
.inst p{color:var(--espresso2);line-height:1.7;margin-bottom:1rem;}
.inst pre{background:var(--cream);border-radius:14px;padding:1rem;font-size:.78rem;overflow:auto;max-height:260px;margin:1rem 0;}
.wees{grid-column:1/-1;font-size:.8rem;font-weight:800;color:#A04545;}
.bz{margin-bottom:1.5rem;padding:.4rem 1.25rem 1rem;}
.bz summary{cursor:pointer;font-weight:800;color:var(--espresso);padding:.8rem 0;}
.bz-rij{display:grid;grid-template-columns:minmax(0,1.3fr) 110px minmax(0,1.5fr);gap:1rem;align-items:center;padding:.55rem .75rem;border-left:4px solid var(--c);border-radius:10px;background:var(--bg);margin-bottom:.4rem;}
.bz-rij.voorbij{opacity:.5;}
.bz-wanneer{font-size:.84rem;color:var(--espresso2);}
.bz-wanneer b{display:block;color:var(--espresso);font-size:.86rem;}
.bz-wie{font-size:.8rem;color:var(--espresso2);}
.bz-wie i{color:var(--muted);}
@media(max-width:900px){.bz-rij{grid-template-columns:1fr auto;}.bz-wie{grid-column:1/-1;}}
.evk{padding:1.25rem 1.4rem;margin-bottom:1rem;}
.evk.aangevraagd{border-left:5px solid var(--gold);}
.evk.bevestigd{border-left:5px solid var(--sage);}
.evk.uit{opacity:.62;}
.evk-kop{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;flex-wrap:wrap;}
.evk-wat{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--espresso);}
.evk-wanneer{font-weight:800;color:var(--espresso2);margin-top:.15rem;}
.evk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.35rem 1.5rem;margin:.9rem 0 .4rem;font-size:.92rem;color:var(--espresso2);}
.evk-grid b{color:var(--espresso);}
.evk-contact{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0;}
.evk-botst{margin:.6rem 0;padding:.6rem .9rem;border-radius:12px;background:#FBF0EE;color:#9E3B3B;font-weight:800;font-size:.88rem;}
.evk-antw{margin:.5rem 0;padding:.6rem .9rem;border-radius:12px;background:var(--cream);font-style:italic;font-size:.9rem;}
.evk-form{display:grid;grid-template-columns:160px 1fr;gap:.6rem;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--border);}
.evk-form input,.evk-form textarea,.evp input{border:1.5px solid var(--border);border-radius:12px;padding:.55rem .8rem;font-family:'Nunito',sans-serif;font-size:.95rem;background:var(--vanilla);width:100%;}
.evk-form textarea{min-height:44px;resize:vertical;}
.evk-knoppen{grid-column:1/-1;display:flex;gap:.5rem;flex-wrap:wrap;}
.evp{padding:1rem 1.4rem;margin-bottom:1.25rem;}
.evp summary{cursor:pointer;font-weight:800;color:var(--espresso);padding:.4rem 0;}
.evp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin:.75rem 0;}
.evp label{display:block;font-size:.78rem;font-weight:800;color:var(--muted);margin-bottom:.25rem;}
@media(max-width:900px){.evk-grid,.evk-form{grid-template-columns:1fr;}.evp-grid{grid-template-columns:1fr 1fr;}}
.geen-toegang{padding:3rem 2.5rem;text-align:center;max-width:540px;margin:0 auto;}

.geen-toegang p{color:var(--espresso2);margin-bottom:1.5rem;line-height:1.7;}
@media(max-width:900px){
  .kpis{grid-template-columns:1fr 1fr;}
  .rij{grid-template-columns:1fr;gap:.35rem;}
  .rij .acties{justify-content:flex-start;}
  .lid{grid-template-columns:1fr;}
  .lid .acties{justify-content:flex-start;}
}
</style>
<meta name="theme-color" content="#FDF8EE">
<script src="assets/splash.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Vie en Rose">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="assets/app.js" defer></script>
</head>
<body>
<script src="assets/site.js"></script>
<script src="assets/boeken.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="assets/db.js"></script>
<script src="assets/rooster-editor.js"></script>


<header class="page-hero">
  <div class="ph-bg"></div><div class="ph-mid"></div>
  <div class="ph-inner">
    <div class="ph-badge"><div class="badge-dot"></div>Enkel voor de beheerder</div>
    <h1 class="ph-title"><span class="ph-word" style="animation-delay:.3s;">Beheer</span></h1>
  </div>
</header>
<div class="morph-divider"><svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path id="wavePath" d="M0,40 C240,80 480,0 720,40 C960,80 1200,0 1440,40 L1440,80 L0,80 Z" fill="#FDF8EE"/></svg></div>

<main>
  <section class="sec">
    <div class="inner" id="inhoud"><div class="leeg">Laden…</div></div>
  </section>
</main>

<script>
var weekStart=mondayOf(new Date()),filter='alle',boekingen=[],profielen=[],zoekterm='';

function tabs(actief){
  var wacht=profielen.filter(wachtOpGoedkeuring).length;
  return '<div class="tabs">'+[['res','📅 Reservaties'],['rooster','🗓️ Rooster'+(reAantalWijzigingen()?' <span class="teller">'+reAantalWijzigingen()+'</span>':'')],['leden','👥 Leden'+(wacht?' <span class="teller">'+wacht+'</span>':'')],['ev','🎉 Evenementen'+(evNieuw()?' <span class="teller">'+evNieuw()+'</span>':'')]].map(function(t){
    return '<button class="tab'+(t[0]===actief?' actief':'')+'" onclick="toonTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+
    '<a class="tab" href="beurten.html" style="text-decoration:none;">🎟️ Beurtenkaarten ↗</a></div>';
}
var huidigeTab='res';
function toonTab(t){huidigeTab=t;render();}

/* ── RESERVATIES ── */
function laadWeek(){
  return DB.admin.boekingen(weekStart,addDays(weekStart,7)).then(function(d){
    var nu=Date.now();   // vervallen onbetaalde reservaties niet tonen
    boekingen=d.filter(function(b){return !(b.status==='wacht-op-betaling'&&vervaltOm(b)<=nu);});
  });
}
function wijzigWeek(n){weekStart=n===0?mondayOf(new Date()):addDays(weekStart,7*n);laadWeek().then(render).catch(fout);}
function zichtbaar(){return boekingen.filter(function(b){return filter==='alle'||b.status===filter;});}
function lesInfo(b){var s=parseSlot(b.slotId);var lesId=b.slotId.split('_')[1];var les=b.status==='intern'?{naam:b.activiteit,icon:activiteitIcon(b.activiteit)}:lesId==='zaal'?ZAAL:LESSEN[lesId]||{naam:lesId,icon:'•'};return {les:les,tijd:b.slotId.slice(11,16),datum:new Date(b.slotId.slice(0,10)+'T00:00'),s:s};}

function paneelReservaties(){
  var eind=addDays(weekStart,6),lijst=zichtbaar();
  var som=function(f){return lijst.reduce(function(n,b){return n+f(b);},0);};
  var zaalUren=som(function(b){return /_zaal$/.test(b.slotId)&&b.status!=='intern'?b.duur/60:0;});
  var ontvangen=som(function(b){return b.status==='betaald'?b.bedrag:0;});
  var open=som(function(b){return b.status!=='betaald'?b.bedrag:0;});
  var h='<div class="balk"><div class="balk-l"><button class="knop rond" onclick="wijzigWeek(-1)" aria-label="Vorige week">‹</button>'+
    '<button class="knop" onclick="wijzigWeek(0)">Deze week</button><button class="knop rond" onclick="wijzigWeek(1)" aria-label="Volgende week">›</button>'+
    '<span class="week-titel">'+weekStart.getDate()+' '+MAANDEN[weekStart.getMonth()]+' – '+eind.getDate()+' '+MAANDEN[eind.getMonth()]+' '+eind.getFullYear()+'</span></div>'+
    '<div class="balk-r"><select class="knop" onchange="filter=this.value;render()">'+[['alle','Alle statussen'],['wacht-op-betaling','Wacht op betaling'],['bevestigd','Betalen aan de bar'],['betaald','Betaald'],['intern','Ingepland (eigen)']].map(function(o){
      return '<option value="'+o[0]+'"'+(filter===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>'+
    '<button class="knop" onclick="exportCsv()">⬇️ CSV</button><button class="knop" onclick="laadWeek().then(render).catch(fout)">↻ Vernieuwen</button></div></div>'+
    '<div class="kpis"><div class="card kpi"><b>'+lijst.length+'</b><span>Reservaties</span></div><div class="card kpi"><b>'+fmtUren(zaalUren).replace(' uur','u')+'</b><span>Zaalhuur</span></div>'+
    '<div class="card kpi"><b>'+fmtEuro(ontvangen)+'</b><span>Betaald</span></div><div class="card kpi"><b>'+fmtEuro(open)+'</b><span>Nog te ontvangen</span></div></div>';
  h+=bezettingOverzicht();
  if(!lijst.length)return h+'<div class="card leeg">Geen reservaties in deze week.</div>';
  var perDag={};lijst.forEach(function(b){(perDag[b.slotId.slice(0,10)]=perDag[b.slotId.slice(0,10)]||[]).push(b);});
  Object.keys(perDag).sort().forEach(function(dag){
    var d=new Date(dag+'T00:00');
    h+='<div class="dag"><div class="dag-kop">'+fmtDatum(d)+'</div><div class="card">'+perDag[dag].map(function(b){
      var i=lesInfo(b),p=b.profiel||{};
      var st=b.status==='intern'?'intern':b.status==='betaald'?'betaald':b.status==='bevestigd'?'bevestigd':'wacht';
      return '<div class="rij"><div class="uur">'+i.tijd+' – '+eindTijd(i.tijd,b.duur)+'</div>'+
        '<div class="wat">'+i.les.icon+' '+esc(i.les.naam)+(b.voorWie?'<small>voor '+esc(b.voorWie)+'</small>':'')+'</div>'+
        '<div class="wie">'+esc(p.naam||'?')+' '+(p.type?typeBadge(p):'')+'<small>'+esc(p.email||'')+(b.opmerking?' · “'+esc(b.opmerking)+'”':'')+'</small></div>'+
        (wees(b)?'<div class="wees">⚠️ Dit uur staat niet meer in het rooster</div>':'')+
        '<div class="acties">'+(wees(b)?'<button class="knop" onclick="verplaatsVraag(\''+b.id+'\')">🔁 Verplaats</button>':'')+'<span class="status '+st+'">'+statusLabel(b)+'</span><span class="bedrag">'+fmtEuro(b.bedrag)+'</span>'+
        (b.status!=='betaald'&&b.status!=='intern'?'<button class="knop groen" onclick="zetBetaald(\''+b.id+'\')">✓ Betaald</button>':'')+
        '<button class="knop rood" onclick="annuleer(\''+b.id+'\')">'+(b.status==='intern'?'Verwijderen':'Annuleren')+'</button></div></div>';
    }).join('')+'</div></div>';
  });
  return h;
}
// Hoe vol zit elke les van deze week (met de namen van wie komt)?
function bezettingOverzicht(){
  var rijen=[];
  for(var i=0;i<7;i++)slotsVoorDag(addDays(weekStart,i)).forEach(function(s){
    var wie=boekingen.filter(function(b){return b.slotId===s.id;});
    rijen.push('<div class="bz-rij les-'+s.lesId+(isVoorbij(s)?' voorbij':'')+'"><div class="bz-wanneer"><b>'+DAGEN_KORT[s.datum.getDay()]+' '+s.datum.getDate()+'/'+(s.datum.getMonth()+1)+' · '+s.tijd+'</b>'+s.les.icon+' '+esc(slotNaam(s))+' · '+esc(s.trainer)+'</div>'+
      bezettingHtml(wie.length,s.les.max)+'<div class="bz-wie">'+(wie.length?wie.map(function(b){return esc((b.profiel&&b.profiel.naam)||'?')+(b.voorWie?' (voor '+esc(b.voorWie)+')':'');}).join(', '):'<i>nog niemand</i>')+'</div></div>');
  });
  return '<details class="card bz" open><summary>📊 Bezetting van de lessen deze week</summary>'+(rijen.length?rijen.join(''):'<div class="leeg">Geen lessen in deze week.</div>')+'</details>';
}
// Les-reservatie op een uur dat niet (meer) in het rooster staat?
function wees(b){var les=b.slotId.split('_')[1];return les!=='zaal'&&b.status!=='intern'&&!parseSlot(b.slotId);}
function verplaatsVraag(id){
  var b=boekingen.find(function(x){return x.id===id;});if(!b)return;
  var i=lesInfo(b),les=b.slotId.split('_')[1],ma=mondayOf(i.datum),opties=[];
  for(var k=0;k<7;k++)slotsVoorDag(addDays(ma,k)).forEach(function(s){if(s.lesId===les)opties.push(s);});
  ed.venster('<h2 class="card-title">Reservatie verplaatsen</h2><p style="color:var(--espresso2);">'+esc((b.profiel||{}).naam||'?')+' · '+fmtDatum(i.datum)+' om '+i.tijd+'. Kies het nieuwe uur in dezelfde week:</p>'+
    (opties.length?opties.map(function(s){return '<button class="knop" style="width:100%;justify-content:flex-start;margin-top:.5rem;" onclick="verplaats(\''+id+'\',\''+s.id+'\')">'+s.les.icon+' '+fmtDatum(s.datum)+' · '+s.tijd+' · '+esc(slotNaam(s))+'</button>';}).join('')
      :'<p>Er is die week geen '+esc(i.les.naam.toLowerCase())+' meer in het rooster.</p>')+
    '<div class="m-knoppen" style="margin-top:1rem;"><button class="knop" onclick="ed.sluit()">Annuleren</button></div>');
}
function verplaats(id,slotId){
  var b=boekingen.find(function(x){return x.id===id;}),s=parseSlot(slotId);if(!b||!s)return;
  DB.admin.verplaats(id,s.start,b.duur).then(function(){ed.sluit();showToast('✓ Verplaatst naar '+fmtDatum(s.datum).toLowerCase()+' '+s.tijd);}).then(laadWeek).then(render).catch(fout);
}
function zetBetaald(id){DB.admin.zetStatus(id,'betaald').then(function(){showToast('✓ Gemarkeerd als betaald');}).then(laadWeek).then(render).catch(fout);}
function annuleer(id){
  var b=boekingen.find(function(x){return x.id===id;});if(!b)return;
  var i=lesInfo(b);
  if(!confirm('Reservatie annuleren?\n\n'+i.les.naam+' · '+fmtDatum(i.datum)+' '+i.tijd+'\n'+((b.profiel||{}).naam||'')))return;
  DB.admin.annuleer(id).then(function(){showToast('Reservatie geannuleerd');}).then(laadWeek).then(render).catch(fout);
}
function exportCsv(){
  var q=function(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  var rijen=[['Datum','Van','Tot','Wat','Naam','E-mail','Type','Voor','Opmerking','Status','Bedrag']];
  zichtbaar().forEach(function(b){var i=lesInfo(b),p=b.profiel||{};
    rijen.push([b.slotId.slice(0,10),i.tijd,eindTijd(i.tijd,b.duur),i.les.naam,p.naam,p.email,p.type?getType(p.type).label:'',b.voorWie,b.opmerking,statusLabel(b),b.bedrag.toFixed(2).replace('.',',')]);});
  var blob=new Blob(['﻿'+rijen.map(function(r){return r.map(q).join(';');}).join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='reservaties-'+isoDate(weekStart)+'.csv';a.click();
}

/* ── LEDEN ── */
function paneelLeden(){
  var wacht=profielen.filter(wachtOpGoedkeuring);
  var lijst=profielen.filter(function(p){var z=zoekterm.toLowerCase();return !z||(p.naam+' '+p.email).toLowerCase().indexOf(z)>=0;})
    .sort(function(a,b){return wachtOpGoedkeuring(b)-wachtOpGoedkeuring(a);});
  var h='<div class="balk"><div class="balk-l"><input class="zoek" placeholder="Zoek op naam of e-mail…" value="'+esc(zoekterm)+'" oninput="zoekterm=this.value;tekenLeden()"></div>'+
    '<div class="balk-r"><span class="week-titel">'+profielen.length+' accounts'+(wacht.length?' · '+wacht.length+' wachten op goedkeuring':'')+'</span></div></div>';
  return h+'<div class="card" id="ledenLijst">'+ledenHtml(lijst)+'</div>';
}
function ledenHtml(lijst){
  if(!lijst.length)return '<div class="leeg">Geen accounts gevonden.</div>';
  return lijst.map(function(p){
    var t=getType(p.type),ik=DB.user&&p.id===DB.user.id;
    return '<div class="lid'+(wachtOpGoedkeuring(p)?' wacht':'')+'"><div><div class="nm">'+esc(p.naam||'(geen naam)')+(ik?' <small>(jij)</small>':'')+'</div><div class="em">'+esc(p.email)+' · sinds '+new Date(p.aangemaakt).toLocaleDateString('nl-BE')+'</div></div>'+
      '<div><select class="knop" onchange="wijzigType(\''+p.id+'\',this.value)">'+TYPES.map(function(x){return '<option value="'+x.id+'"'+(x.id===p.type?' selected':'')+'>'+x.icon+' '+esc(x.label)+'</option>';}).join('')+'</select></div>'+
      '<div class="acties">'+(t.pro?(p.goedgekeurd?'<span class="status betaald">Goedgekeurd</span><button class="knop" onclick="keurGoed(\''+p.id+'\',false)">Intrekken</button>':'<span class="status wacht">Wacht op goedkeuring</span><button class="knop groen" onclick="keurGoed(\''+p.id+'\',true)">✓ Goedkeuren</button>'):'<span class="status bevestigd">Lid</span>')+
      (ik?'':'<button class="knop rood" onclick="verwijderLid(\''+p.id+'\')">Verwijderen</button>')+'</div></div>';
  }).join('');
}
function tekenLeden(){var z=zoekterm.toLowerCase();document.getElementById('ledenLijst').innerHTML=ledenHtml(profielen.filter(function(p){return !z||(p.naam+' '+p.email).toLowerCase().indexOf(z)>=0;}));}
function laadLeden(){return DB.admin.profielen().then(function(d){profielen=d;});}
function keurGoed(id,ja){DB.admin.wijzigProfiel(id,{goedgekeurd:ja}).then(function(){showToast(ja?'✓ Goedgekeurd':'Goedkeuring ingetrokken');}).then(laadLeden).then(render).catch(fout);}
function wijzigType(id,type){DB.admin.wijzigProfiel(id,{type:type,goedgekeurd:!getType(type).pro}).then(function(){showToast('Type aangepast');}).then(laadLeden).then(render).catch(fout);}
function verwijderLid(id){
  var p=profielen.find(function(x){return x.id===id;});
  if(!confirm('Account van '+(p.naam||p.email)+' volledig verwijderen?\nOok alle reservaties van dit account worden verwijderd. Dit kan niet ongedaan gemaakt worden.'))return;
  DB.admin.verwijderGebruiker(id).then(function(){showToast('Account verwijderd');}).then(laadLeden).then(render).catch(fout);
}

/* ── ROOSTER ── Weekrooster slepen met de muis (de kalender zelf staat in assets/rooster-editor.js).
   De beheerder kan alle lessen aanpassen en per les een lesgever kiezen; die lesgever kan zijn
   of haar uren daarna zelf verschuiven bij Mijn account. */
var ed=null;
function reAantalWijzigingen(){return ed?ed.aantal():0;}
function maakEditor(rooster){
  ed=new RoosterEditor({el:'reHier',rooster:rooster,gesloten:dbInst.config.gesloten||{},dichtBeheer:true,lessen:Object.keys(LESSEN),
    lesgevers:function(les){return profielen.filter(function(p){return isGoedgekeurdePro(p)&&(getType(p.type).lessen||[]).indexOf(les)>=0;})
      .map(function(p){return {id:p.id,naam:p.naam||p.email};});},
    hulp:'Klik op een les om ook de <b>lesgever</b> te kiezen: goedgekeurde lesgevers verschuiven hun eigen uren dan zelf bij <i>Mijn account</i>. ',
    publiceer:rePubliceer,naWijziging:tekenTabs});
}
function paneelRooster(){return dbInst?'<div id="reHier"></div>':'<div class="card leeg">Het rooster kon niet geladen worden uit de database.</div>';}
function tekenTabs(){var t=document.querySelector('#inhoud .tabs');if(t)t.outerHTML=tabs(huidigeTab);}

// Rooster vergelijken (volgorde en lege dagen tellen niet)
function roosterSleutel(r){var l=[];for(var d=0;d<7;d++)(r&&r[d]||[]).forEach(function(x){l.push(d+'|'+x[0]+'|'+x[1]+'|'+(x[2]||''));});return l.sort().join(',');}
/* Publiceren: eerst nagaan welke komende reservaties geraakt worden */
// Welke wekelijkse lessen zijn verschoven (zelfde les, ander uur of andere dag)? oud "dow|uu:mm|les" → nieuw
function verschuivingen(){
  var v={};
  ed.orig.forEach(function(o){
    var w=ed.zoek(o.uid);
    if(w&&w.les===o.les&&(w.dow!==o.dow||w.min!==o.min))v[o.dow+'|'+tijdTekst(o.min)+'|'+o.les]={dow:w.dow,min:w.min};
  });
  return v;
}
// Nieuw tijdstip van een reservatie als haar les verschuift (in dezelfde week, ma–zo)
function nieuwStart(b,naar){
  var d=new Date(b.slotId.slice(0,10)+'T00:00'),dag=addDays(d,((naar.dow+6)%7)-((d.getDay()+6)%7));
  return new Date(dag.getFullYear(),dag.getMonth(),dag.getDate(),0,naar.min);
}
/* Publiceren: reservaties van verschoven lessen gaan mee; andere geraakte reservaties eerst tonen */
function rePubliceer(nieuw){
  var nu=new Date(),schuif=verschuivingen(),dicht=ed.naarGesloten();
  DB.admin.boekingen(nu,addDays(nu,400)).then(function(lijst){
    var vrij=Date.now(),mee=[];
    var geraakt=lijst.filter(function(b){return !(b.status==='wacht-op-betaling'&&vervaltOm(b)<=vrij);}).map(function(b){
      var d=new Date(b.slotId.slice(0,10)+'T00:00'),dow=d.getDay(),t=b.slotId.slice(11,16),les=b.slotId.split('_')[1],van=naarMin(t),tot=van+b.duur;
      if(les!=='zaal'&&b.status!=='intern'){
        var naar=schuif[dow+'|'+t+'|'+les];
        if(naar){mee.push({b:b,start:nieuwStart(b,naar)});return null;}
        if(!(nieuw[dow]||[]).some(function(x){return x[0]===t&&x[1]===les;}))return {b:b,reden:'staat niet meer in het rooster'};
        var g=(dicht[dow]||[]).find(function(g){return naarMin(g[0])<tot&&naarMin(g[1])>van;});
        return g?{b:b,reden:'valt in de gesloten periode '+g[0]+' – '+g[1]}:null;
      }
      var x=(nieuw[dow]||[]).find(function(x){var s=naarMin(x[0]);return s<tot&&s+LESSEN[x[1]].duur>van;});
      return x?{b:b,reden:'overlapt met '+LESSEN[x[1]].naam+' om '+x[0]}:null;
    }).filter(Boolean);
    window._mee=mee;
    if(!geraakt.length&&!mee.length)return reOpslaan(nieuw,[]);
    var rij=function(b,extra){var i=lesInfo(b),p=b.profiel||{};
      return '<div><b>'+fmtDatum(i.datum)+' '+i.tijd+'</b> · '+i.les.icon+' '+esc(i.les.naam)+' · '+esc(p.naam||'?')+'<br><small>'+extra+'</small></div>';};
    ed.venster((mee.length?'<h2 class="card-title">🔁 '+mee.length+' reservatie'+(mee.length>1?'s gaan':' gaat')+' mee</h2>'+
        '<p style="color:var(--espresso2);line-height:1.6;font-size:.92rem;">Deze lessen verschuif je; de reservaties verhuizen automatisch mee naar het nieuwe uur. De klant ziet het nieuwe uur bij <i>Mijn reservaties</i>. Laat het de klant gerust ook even weten.</p>'+
        '<div class="m-lijst">'+mee.map(function(m){return rij(m.b,'→ wordt '+fmtDatum(m.start).toLowerCase()+' om '+pad(m.start.getHours())+':'+pad(m.start.getMinutes()));}).join('')+'</div>':'')+
      (geraakt.length?'<h2 class="card-title">⚠️ '+geraakt.length+' komende reservatie'+(geraakt.length>1?'s':'')+' geraakt</h2>'+
        '<p style="color:var(--espresso2);line-height:1.6;font-size:.92rem;">Deze reservaties blijven bestaan op het oude uur. Verplaats ze daarna in het tabblad <b>Reservaties</b> (knop <i>Verplaats</i>) of annuleer ze.</p>'+
        '<div class="m-lijst">'+geraakt.map(function(g){return rij(g.b,esc(g.reden));}).join('')+'</div>':'')+
      '<div class="m-knoppen"><button class="knop" onclick="ed.sluit()">Terug naar de kalender</button><button class="knop groen" onclick="ed.sluit();reOpslaan(ed.naarRooster(),window._mee)">Publiceren</button></div>');
  }).catch(fout);
}
function reOpslaan(nieuw,mee){
  // Altijd de nieuwste instellingen ophalen, zodat enkel het rooster verandert
  DB.admin.instellingen().then(function(d){
    var nu=d&&d.config&&d.config.rooster;
    if(nu&&roosterSleutel(nu)!==roosterSleutel(ed.origRooster)){
      dbInst=d;
      ed.venster('<h2 class="card-title">Het rooster is intussen gewijzigd</h2><p style="color:var(--espresso2);line-height:1.6;font-size:.92rem;">Een lesgever heeft intussen eigen uren aangepast. Laad eerst het nieuwste rooster en doe je wijziging daarna opnieuw, zodat je die uren niet overschrijft.</p>'+
        '<div class="m-knoppen"><button class="knop" onclick="ed.sluit()">Annuleren</button><button class="knop groen" onclick="ed.sluit();zetRooster(dbInst.config.rooster);zetUren(dbInst.config);ed.laad(dbInst.config.rooster,dbInst.config.gesloten||{});render();">Nieuwste rooster laden</button></div>');
      return 'gestopt';
    }
    // rooster én gesloten periodes (🔒) uit de kalender
    var cfg=Object.assign({},d&&d.config||configVoorDatabase(nieuw),{rooster:nieuw,gesloten:ed.naarGesloten()});
    return DB.admin.zetInstellingen(cfg).then(laadInst).then(function(){
      // reservaties van verschoven lessen mee verplaatsen
      return Promise.all((mee||[]).map(function(m){return DB.admin.verplaats(m.b.id,m.start,m.b.duur);}));
    }).then(function(){
      zetRooster(dbInst.config.rooster);zetUren(dbInst.config);ed.laad(dbInst.config.rooster,dbInst.config.gesloten||{});
      return laadWeek().catch(function(){});
    }).then(function(){
      render();
      showToast('✓ Rooster gepubliceerd'+((mee||[]).length?' · '+mee.length+' reservatie'+(mee.length>1?'s':'')+' verplaatst':''));
    });
  }).catch(fout);
}

/* ── INSTELLINGEN ── */
var dbInst=null;
function laadInst(){return DB.admin.instellingen().then(function(d){dbInst=d;});}

/* ── EVENEMENTEN ── Aanvragen om het café te huren (huren.html): bevestigen, weigeren, annuleren */
var verhuur=[],evFilter='nieuw';
function laadVerhuur(){return DB.verhuur.alle().then(function(d){verhuur=d||[];}).catch(function(){verhuur=[];});}
function evNieuw(){return verhuur.filter(function(v){return v.status==='aangevraagd'&&new Date(v.start)>new Date();}).length;}
var EV_STATUS={aangevraagd:['wacht','Nieuwe aanvraag'],bevestigd:['betaald','Bevestigd'],geweigerd:['intern','Geweigerd'],geannuleerd:['intern','Geannuleerd'],ingetrokken:['intern','Ingetrokken door klant']};
function evTijd(v){
  var a=new Date(v.start),b=new Date(v.eind),u=(b-a)/36e5;
  return fmtDatum(a)+' '+a.getFullYear()+' · '+pad(a.getHours())+':'+pad(a.getMinutes())+' – '+pad(b.getHours())+':'+pad(b.getMinutes())+
    (b.toDateString()!==a.toDateString()?' (volgende dag)':'')+' · '+fmtUren(u);
}
function waNummer(t){var d=String(t||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);else if(d.charAt(0)==='0')d='32'+d.slice(1);return d;}
function paneelEvenementen(){
  var nu=new Date(),pr=VERHUUR.prijzen;
  var lijst=verhuur.filter(function(v){var komend=new Date(v.eind)>nu;
    return evFilter==='nieuw'?v.status==='aangevraagd'&&komend:evFilter==='komend'?v.status==='bevestigd'&&komend:true;});
  if(evFilter==='alles')lijst=lijst.slice().reverse();
  var f=function(id,t,n){return '<button class="knop'+(evFilter===id?' groen':'')+'" onclick="evFilter=\''+id+'\';render()">'+t+(n!=null?' ('+n+')':'')+'</button>';};
  var h='<div class="balk"><div class="balk-l">'+f('nieuw','⏳ Nieuwe aanvragen',evNieuw())+
    f('komend','✓ Komende evenementen',verhuur.filter(function(v){return v.status==='bevestigd'&&new Date(v.eind)>nu;}).length)+f('alles','Alles')+'</div>'+
    '<div class="balk-r"><a class="knop" href="huren.html" target="_blank">Aanvraagformulier bekijken ↗</a></div></div>';
  h+='<details class="card evp"'+(pr.cafeUur==null?' open':'')+'><summary>💶 Prijzen en regels voor de verhuur</summary>'+
    '<p style="font-size:.88rem;color:var(--espresso2);margin-top:.4rem;">Klanten zien deze prijzen als richtprijs. Laat een prijs leeg voor "prijs op aanvraag". Het terras is altijd inbegrepen.</p>'+
    '<div class="evp-grid"><div><label for="pCafe">Café + terras (€/uur)</label><input id="pCafe" type="number" min="0" step="1" value="'+(pr.cafeUur==null?'':pr.cafeUur)+'"></div>'+
    '<div><label for="pZaal">Grote zaal erbij (+ €/uur)</label><input id="pZaal" type="number" min="0" step="1" value="'+(pr.zaalUur==null?'':pr.zaalUur)+'"></div>'+
    '<div><label for="pMin">Minimum uren</label><input id="pMin" type="number" min="1" max="12" step=".5" value="'+VERHUUR.minUren+'"></div>'+
    '<div><label for="pDagen">Minimum dagen op voorhand</label><input id="pDagen" type="number" min="0" max="90" value="'+VERHUUR.minDagenVooraf+'"></div></div>'+
    '<button class="knop groen" onclick="bewaarVerhuurRegels()">Opslaan</button></details>';
  if(!lijst.length)return h+'<div class="card leeg">'+(evFilter==='nieuw'?'Geen nieuwe aanvragen. 🎉':evFilter==='komend'?'Nog geen bevestigde evenementen.':'Nog geen aanvragen.')+'</div>';
  return h+lijst.map(evKaart).join('');
}
function evKaart(v){
  var g=v.gegevens||{},s=verhuurSoort(v.soort),st=EV_STATUS[v.status]||['intern',v.status],open=v.status==='aangevraagd'||v.status==='bevestigd';
  var voorbij=new Date(v.eind)<new Date(),wa=waNummer(v.telefoon),em=v.profielen&&v.profielen.email;
  var rij=function(k,w){return w?'<div><b>'+k+':</b> '+esc(w)+'</div>':'';};
  // overlap met andere open aanvragen of bevestigde evenementen
  var botst=open?verhuur.filter(function(x){return x.id!==v.id&&(x.status==='aangevraagd'||x.status==='bevestigd')&&x.start<v.eind&&x.eind>v.start;}):[];
  var richt=g.richtprijs!=null?g.richtprijs:verhuurPrijs((new Date(v.eind)-new Date(v.start))/36e5,v.met_zaal);
  var h='<div class="card evk '+v.status+(open&&!voorbij?'':' uit')+'"><div class="evk-kop"><div><div class="evk-wat">'+s.icon+' '+esc(v.soort)+(g.gelegenheid?' <small style="font-family:Nunito,sans-serif;font-weight:600;font-size:.9rem;color:var(--muted)">· '+esc(g.gelegenheid)+'</small>':'')+'</div>'+
    '<div class="evk-wanneer">'+evTijd(v)+'</div></div><span class="status '+st[0]+'">'+st[1]+(voorbij?' · voorbij':'')+'</span></div>'+
    '<div class="evk-grid">'+rij('Ruimte',v.met_zaal?'Café + terras + grote zaal':'Café + terras')+rij('Gasten',v.gasten+(g.kinderen?' (waarvan '+g.kinderen+' kinderen)':''))+
      rij('Inrichting',g.opstelling)+rij('Eten en drinken',g.catering)+rij('Drank',g.drank)+rij('Extra’s',(g.extras||[]).join(', '))+
      rij('Bedrijf',[g.bedrijf,g.btw].filter(Boolean).join(' · '))+rij('Richtprijs',richt!=null?fmtEuro(+richt):'')+rij('Aangevraagd op',new Date(v.aangemaakt).toLocaleDateString('nl-BE'))+'</div>'+
    (g.opmerkingen?'<div class="evk-antw" style="font-style:normal">💬 '+esc(g.opmerkingen)+'</div>':'')+
    '<div class="evk-contact"><b style="align-self:center;margin-right:.25rem;">'+esc(v.naam)+'</b><a class="knop" href="tel:'+esc(v.telefoon.replace(/[^\d+]/g,''))+'">📞 '+esc(v.telefoon)+'</a>'+
      (wa?'<a class="knop" target="_blank" rel="noopener" href="https://wa.me/'+wa+'">💬 WhatsApp</a>':'')+(em?'<a class="knop" href="mailto:'+esc(em)+'?subject='+encodeURIComponent('Je aanvraag bij La Vie en Rose: '+v.soort)+'">✉️ '+esc(em)+'</a>':'')+'</div>'+
    botst.map(function(x){return '<div class="evk-botst">⚠️ Overlapt met '+(x.status==='bevestigd'?'het bevestigde evenement':'de aanvraag')+' "'+esc(x.soort)+'" van '+esc(x.naam)+' ('+evTijd(x)+')</div>';}).join('')+
    (v.prijs!=null&&v.status==='bevestigd'?'<div><b>Afgesproken prijs:</b> '+fmtEuro(+v.prijs)+'</div>':'')+
    (v.antwoord?'<div class="evk-antw">Jouw bericht: “'+esc(v.antwoord)+'”</div>':'');
  if(open&&!voorbij){
    h+='<div class="evk-form"><label for="pr-'+v.id+'" style="align-self:center;font-weight:800;">Prijs (€)</label><input id="pr-'+v.id+'" type="number" min="0" step="1" value="'+(v.prijs!=null?+v.prijs:richt!=null?richt:'')+'" placeholder="mag leeg">'+
      '<label for="an-'+v.id+'" style="align-self:center;font-weight:800;">Bericht aan de klant</label><textarea id="an-'+v.id+'" maxlength="1000" placeholder="bv. Leuk! We bellen je deze week om alles te bespreken.">'+esc(v.antwoord||'')+'</textarea>'+
      '<div class="evk-knoppen">'+(v.status==='aangevraagd'?'<button class="knop groen" onclick="evZet(\''+v.id+'\',\'bevestigd\')">✓ Bevestigen</button><button class="knop rood" onclick="evZet(\''+v.id+'\',\'geweigerd\')">✗ Weigeren</button>':
        '<button class="knop groen" onclick="evZet(\''+v.id+'\',\'bevestigd\')">Prijs en bericht bijwerken</button><button class="knop rood" onclick="evZet(\''+v.id+'\',\'geannuleerd\')">Evenement annuleren</button>')+'</div></div>';
  }
  return h+'</div>';
}
function evZet(id,status){
  var v=verhuur.find(function(x){return x.id===id;}),pr=document.getElementById('pr-'+id).value,an=document.getElementById('an-'+id).value.trim();
  if(status==='geweigerd'&&!confirm('Aanvraag van '+v.naam+' weigeren?'+(an?'':'\nTip: schrijf er een kort bericht bij, dat ziet de klant.')))return;
  if(status==='geannuleerd'&&!confirm('Het bevestigde evenement van '+v.naam+' annuleren? Laat het de klant zeker ook persoonlijk weten.'))return;
  DB.verhuur.zetStatus(id,status,pr===''?null:+pr,an).then(function(){
    showToast(status==='bevestigd'?(v.status==='bevestigd'?'✓ Bijgewerkt':'✓ Bevestigd: het café is dan verhuurd'):status==='geweigerd'?'Aanvraag geweigerd':'Evenement geannuleerd');
  }).then(laadVerhuur).then(render).catch(fout);
}
function bewaarVerhuurRegels(){
  var num=function(id){var x=document.getElementById(id).value;return x===''?null:+x;};
  var nieuw={prijzen:{cafeUur:num('pCafe'),zaalUur:num('pZaal')},minUren:num('pMin')||2,minDagenVooraf:num('pDagen')==null?7:num('pDagen')};
  // altijd de nieuwste instellingen ophalen, zodat enkel de verhuur verandert
  DB.admin.instellingen().then(function(d){
    return DB.admin.zetInstellingen(Object.assign({},d.config,{verhuur:nieuw}));
  }).then(laadInst).then(function(){zetVerhuur(nieuw);showToast('✓ Prijzen en regels opgeslagen');render();}).catch(fout);
}

/* ── ALGEMEEN ── */
function fout(e){showToast('⚠️ '+e);}
function render(){
  var inh=huidigeTab==='res'?paneelReservaties():huidigeTab==='rooster'?paneelRooster():huidigeTab==='ev'?paneelEvenementen():paneelLeden();
  document.getElementById('inhoud').innerHTML=tabs(huidigeTab)+'<div class="paneel actief">'+inh+'</div>';
  if(huidigeTab==='rooster'&&ed)ed.teken();
}

klaar(function(u){
  if(!requireLogin())return;
  renderNav();
  if(!u.isAdmin){
    document.getElementById('inhoud').innerHTML='<div class="card geen-toegang"><h2 class="card-title">Geen toegang</h2><p>Deze pagina is enkel voor de beheerder van La Vie en Rose.</p><a class="btn btn-primary" href="boeken.html">Naar het rooster</a></div>';
    return;
  }
  Promise.all([laadWeek(),laadLeden(),laadInst(),laadVerhuur()]).then(function(){
    if(dbInst&&dbInst.config&&dbInst.config.rooster){zetRooster(dbInst.config.rooster);zetUren(dbInst.config);maakEditor(dbInst.config.rooster);}
    if(dbInst&&dbInst.config)zetVerhuur(dbInst.config.verhuur);
    if(/[?&]tab=rooster/.test(location.search))huidigeTab='rooster';
    if(/[?&]tab=ev/.test(location.search))huidigeTab='ev';
    if(evNieuw())showToast('🎉 '+(evNieuw()===1?'1 nieuwe aanvraag':evNieuw()+' nieuwe aanvragen')+' om het café te huren');
    if(profielen.some(wachtOpGoedkeuring))showToast('👥 Er '+(profielen.filter(wachtOpGoedkeuring).length===1?'wacht 1 professional':'wachten '+profielen.filter(wachtOpGoedkeuring).length+' professionals')+' op goedkeuring');
    render();
  }).catch(fout);
});
