# Maakt rooster.ics (agenda-abonnement) opnieuw wanneer het rooster in assets/boeken.js wijzigt.
name: Agenda bijwerken
on:
  push:
    branches: [main]
    paths: ['assets/boeken.js', 'tools/maak-agenda.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/maak-agenda.js
      - name: Opslaan als het rooster gewijzigd is
        run: |
          if git diff --quiet rooster.ics; then echo "rooster.ics is al actueel"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooster.ics
          git commit -m "Agenda bijgewerkt uit assets/boeken.js"
          git push
