<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betalen – La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/boeken.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"></script>
<script src="assets/db.js"></script>
<style>
.pay-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:2rem;align-items:start;}
.pay-card{padding:2.25rem;}
.methodes{display:grid;gap:.7rem;margin-bottom:1.5rem;}
.methode{position:relative;}
.methode input{position:absolute;opacity:0;}
.methode label{display:flex;align-items:center;gap:1rem;padding:1.05rem 1.2rem;border:1.5px solid var(--border);border-radius:18px;background:var(--cream);cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);}
.methode label:hover{border-color:var(--rose);transform:translateX(4px);}
.methode input:checked+label{border-color:var(--rose-d);background:var(--rose-pale);box-shadow:0 6px 20px rgba(192,120,120,.15);}
.methode input:focus-visible+label{outline:2px solid var(--rose-d);outline-offset:2px;}
.m-icon{width:46px;height:46px;border-radius:14px;background:var(--vanilla);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;box-shadow:0 2px 10px var(--shadow);transition:transform .25s;}
.methode input:checked+label .m-icon{transform:scale(1.08) rotate(-4deg);}
.m-naam{font-weight:800;color:var(--espresso);font-size:1rem;}
.m-sub{font-size:.82rem;color:var(--muted);}
.m-check{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;transition:border .25s;background:white;}
.methode input:checked+label .m-check{border:7px solid var(--rose-d);}
.samenvatting{padding:2rem;position:sticky;top:96px;}
.les-mini{display:flex;gap:.8rem;align-items:center;padding:.95rem 1.05rem;border-radius:16px;background:var(--bg);border-left:4px solid var(--c);margin-bottom:1rem;}
.les-mini .ic{font-size:1.6rem;}
.les-mini .nm{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:1.1rem;color:var(--espresso);}
.les-mini .wn{font-size:.82rem;color:var(--espresso2);}
.rij{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem;color:var(--espresso2);padding:.5rem 0;}
.rij b{color:var(--espresso);font-weight:700;text-align:right;}
.totaal{border-top:1px solid var(--border);margin-top:.7rem;padding-top:1rem;display:flex;justify-content:space-between;align-items:baseline;}
.totaal span{font-size:.92rem;font-weight:700;color:var(--espresso2);}
.totaal b{font-family:'Playfair Display',serif;font-size:1.9rem;color:var(--rose-d);}
.annuleer{display:block;margin:1.1rem auto 0;background:none;border:none;color:var(--rose-d);font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
.annuleer:hover{color:var(--espresso);}
.veilig{display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--muted);margin-top:1rem;}
.fout-card{padding:3rem 2.5rem;text-align:center;max-width:540px;margin:0 auto;}
.fout-card p{color:var(--espresso2);margin-bottom:1.75rem;line-height:1.7;}
@media(max-width:900px){.pay-grid{grid-template-columns:1fr;}.samenvatting{position:static;order:-1;}.pay-card{padding:1.5rem;}}
</style>
</head>
<body>
<script src="assets/site.js"></script>

<header class="page-hero" style="--ph-img:url('https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=1800&q=80');">
  <div class="ph-bg"></div><div class="ph-mid"></div>
  <div class="ph-inner">
    <a href="boeken.html" class="back-link">← Terug naar het rooster</a><br>
    <div class="ph-badge"><div class="badge-dot"></div>Stap 4 · Betalen</div>
    <h1 class="ph-title">
      <span class="ph-word" style="animation-delay:.3s;">Bijna</span>
      <span class="ph-word script" style="animation-delay:.45s;">klaar</span>
    </h1>
  </div>
</header>
<div class="morph-divider"><svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path id="wavePath" d="M0,40 C240,80 480,0 720,40 C960,80 1200,0 1440,40 L1440,80 L0,80 Z" fill="#FDF8EE"/></svg></div>

<main>
  <section class="sec">
    <div class="blob" style="width:420px;height:420px;top:-60px;left:-160px;background:rgba(232,164,160,.14);"></div>
    <div class="inner" id="inhoud"></div>
  </section>
</main>

<script>
var METHODES=[
  {id:'bancontact',naam:'Bancontact',sub:'Betaal met je bankkaart of de Bancontact-app',icon:'💳'},
  {id:'payconiq',naam:'Payconiq',sub:'Scan de QR-code met je bank-app',icon:'📱'},
  {id:'kaart',naam:'Kredietkaart',sub:'Visa, Mastercard',icon:'💳'},
  {id:'bar',naam:'Betalen aan de bar',sub:'Betaal ter plaatse vóór je sessie',icon:'☕'}
];
var bookingId=new URLSearchParams(location.search).get('booking');
var booking=null,slot=null;

function stappen(n){
  var s=['Uur kiezen','Aanmelden','Reserveren','Betalen'];
  return '<div class="stappen sr up">'+s.map(function(t,i){
    return (i?'<div class="stap-lijn"></div>':'')+'<div class="stap'+(i<n?' klaar':i===n?' actief':'')+'"><i>'+(i<n?'✓':i+1)+'</i>'+t+'</div>';
  }).join('')+'</div>';
}
function toon(html){document.getElementById('inhoud').innerHTML=html;reveal();}

var klok=null,wasOpen=false;
function render(){
  // Alleen eigen reservaties tonen (getBookings laat vervallen reservaties al weg).
  booking=getBookings().find(function(b){return b.id===bookingId;});
  slot=booking&&parseSlot(booking.slotId);
  clearInterval(klok);
  if(!booking||!slot){
    toon(wasOpen
      ?'<div class="card fout-card sr scale"><h2 class="card-title">⏳ Je reservatie is vervallen</h2><p>Je hebt niet binnen '+REGELS.betaaltermijnMin+' minuten betaald, dus je plaats is vrijgegeven. Je kan het uur opnieuw reserveren als het nog vrij is.</p><a class="btn btn-primary" href="boeken.html">Naar het rooster</a></div>'
      :'<div class="card fout-card sr scale"><h2 class="card-title">Reservatie niet gevonden</h2><p>Deze reservatie bestaat niet (meer), is vervallen of hoort niet bij jouw account.</p><a class="btn btn-primary" href="boeken.html">Naar het rooster</a></div>');
    return;
  }
  if(isBevestigd(booking)){
    toon('<div class="card fout-card sr scale"><h2 class="card-title">✓ Je reservatie is bevestigd</h2><p>'+esc(slot.les.naam)+' op '+fmtDatum(slot.datum)+', '+slot.tijd+' – '+boekingEind(booking,slot)+'.<br>'+
      (booking.status==='bevestigd'?'Je betaalt '+fmtEuro(booking.bedrag)+' aan de bar vóór je sessie.':'Betaald: '+fmtEuro(booking.bedrag)+'.')+' Tot dan! 🌹</p>'+
      '<a class="btn btn-primary" href="boeken.html">Naar het rooster</a></div>');
    return;
  }
  wasOpen=true;
  toon(stappen(3)+'<div class="pay-grid"><div class="card pay-card sr left"><p class="eyebrow">Betaalmethode</p><h2 class="card-title">Hoe wil je betalen?</h2>'+
    '<div class="notice" id="klok" style="margin-bottom:1.25rem;"></div><div class="methodes">'+
    METHODES.map(function(m,i){
      return '<div class="methode"><input type="radio" name="methode" id="m-'+m.id+'" value="'+m.id+'"'+(i===0?' checked':'')+' onchange="updateKnop()">'+
        '<label for="m-'+m.id+'"><span class="m-icon">'+m.icon+'</span><span><div class="m-naam">'+m.naam+'</div><div class="m-sub">'+m.sub+'</div></span><span class="m-check"></span></label></div>';
    }).join('')+'</div>'+
    '<div class="notice">🚧 Online betalen wordt binnenkort geactiveerd. Kies voorlopig <b>Betalen aan de bar</b> om je reservatie te bevestigen.</div>'+
    '</div>'+
    '<aside class="card samenvatting les-'+slot.lesId+' sr right"><p class="eyebrow">Je reservatie</p>'+
    '<div class="les-mini"><div class="ic">'+slot.les.icon+'</div><div><div class="nm">'+esc(slot.les.naam)+'</div><div class="wn">'+fmtDatum(slot.datum)+' · '+slot.tijd+' – '+boekingEind(booking,slot)+'</div></div></div>'+
    '<div class="rij"><span>Geboekt door</span><b>'+esc(user.naam)+'</b></div>'+
    '<div class="rij"><span>Type</span><b>'+typeBadge(user)+'</b></div>'+
    (booking.voorWie?'<div class="rij"><span>Voor</span><b>'+esc(booking.voorWie)+'</b></div>':'')+
    '<div class="rij"><span>Duur</span><b>'+fmtUren(boekingDuur(booking,slot)/60)+'</b></div>'+
    '<div class="totaal"><span>Te betalen</span><b>'+fmtEuro(booking.bedrag)+'</b></div>'+
    '<button class="btn btn-primary btn-block" id="betaalKnop" style="margin-top:1.4rem;" onclick="betaal()"></button>'+
    '<div class="veilig">🔒 Veilig betalen</div>'+
    '<button class="annuleer" onclick="annuleer()">Reservatie annuleren</button></aside></div>');
  updateKnop();tik();klok=setInterval(tik,1000);
}
// Aftellen tot de reservatie vervalt
function tik(){
  var rest=Math.max(0,vervaltOm(booking)-Date.now()),m=Math.floor(rest/60000),sec=Math.floor(rest%60000/1000);
  var el=document.getElementById('klok');
  if(el)el.innerHTML='⏳ Je plaats wordt nog <b>'+m+':'+pad(sec)+'</b> vastgehouden. Daarna vervalt je reservatie.';
  if(rest<=0)render();
}
function gekozen(){var r=document.querySelector('input[name=methode]:checked');return r?r.value:'';}
function updateKnop(){
  document.getElementById('betaalKnop').textContent=gekozen()==='bar'?'Bevestig · betalen aan de bar':'Betaal '+fmtEuro(booking.bedrag);
}
function betaal(){
  if(!getBookings().some(function(b){return b.id===booking.id;}))return render();
  if(gekozen()==='bar'){
    var k=document.getElementById('betaalKnop');k.disabled=true;k.textContent='Even geduld…';
    DB.bevestigBar(booking.id)
      .then(function(){showToast('✓ Bevestigd! Je betaalt aan de bar. 🌹');})
      .catch(function(e){showToast(e);})
      .then(DB.laadMijn).then(render);
    return;
  }
  // TODO: hier komt later de koppeling met de betaalprovider (bv. Mollie of Stripe).
  showToast('💡 Online betalen is nog niet actief. Kies "Betalen aan de bar".');
}
function annuleer(){
  if(!confirm('Wil je deze reservatie annuleren?'))return;
  clearInterval(klok);
  DB.annuleer(booking.id)
    .then(function(){showToast('Reservatie geannuleerd');setTimeout(function(){location.href='boeken.html';},700);})
    .catch(function(e){showToast(e);});
}

// Toegangscontrole: niet aangemeld → eerst naar de aanmeldpagina.
var user=null;
klaar(function(u){
  user=u;if(!requireLogin())return;
  renderNav();
  DB.laadMijn().then(render).catch(function(e){toon('<div class="card fout-card"><h2 class="card-title">Geen verbinding</h2><p>'+esc(e)+'</p></div>');});
});
</script>
</body>
</html>
