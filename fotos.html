<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto's – La Vie en Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Nunito:wght@300;400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
/* FILTER */
.filter-bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:2.25rem;}
.filter-lbl{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);margin-right:.4rem;}
.filter-btn{padding:.5rem 1.15rem;border-radius:50px;border:1.5px solid var(--border);background:var(--vanilla);color:var(--espresso2);font-family:'Nunito',sans-serif;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .25s;}
.filter-btn:hover{border-color:var(--rose-d);color:var(--rose-d);transform:translateY(-2px);}
.filter-btn.active{background:var(--rose-d);border-color:var(--rose-d);color:white;box-shadow:0 4px 16px rgba(192,120,120,.35);}

/* GRID */
.gallery-grid{columns:3;column-gap:1.25rem;}
.gallery-item{break-inside:avoid;margin-bottom:1.25rem;border-radius:22px;overflow:hidden;position:relative;cursor:pointer;box-shadow:0 8px 28px var(--shadow);animation:gIn .7s cubic-bezier(.22,1,.36,1) both;transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s;}
@keyframes gIn{from{opacity:0;transform:translateY(30px) scale(.96);}to{opacity:1;transform:none;}}
.gallery-item:hover{transform:translateY(-8px);box-shadow:0 28px 60px rgba(61,32,7,.2);}
.gallery-item img{width:100%;display:block;filter:saturate(.88);transition:transform .8s cubic-bezier(.22,1,.36,1),filter .5s;}
.gallery-item:hover img{transform:scale(1.08);filter:saturate(1.05);}
.gallery-item-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(61,32,7,.75) 0%,transparent 55%);opacity:0;transition:opacity .4s;display:flex;align-items:flex-end;padding:1.25rem;}
.gallery-item:hover .gallery-item-overlay{opacity:1;}
.gallery-item-caption{color:#FDF8EE;font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;transform:translateY(10px);transition:transform .4s;}
.gallery-item:hover .gallery-item-caption{transform:none;}
.gallery-item-tag{display:inline-block;background:var(--rose-d);color:white;font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:50px;margin-bottom:6px;}
.gallery-placeholder{break-inside:avoid;margin-bottom:1.25rem;border-radius:22px;border:2px dashed rgba(192,120,120,.35);background:var(--rose-pale);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;text-align:center;cursor:pointer;transition:all .3s;animation:gIn .7s cubic-bezier(.22,1,.36,1) both;}
.gallery-placeholder:hover{border-color:var(--rose-d);transform:translateY(-4px);}
.gallery-placeholder-icon{font-size:2rem;margin-bottom:.75rem;opacity:.6;}
.gallery-placeholder-text{font-size:.88rem;color:var(--espresso2);line-height:1.6;}
.gallery-placeholder-text strong{font-family:'Playfair Display',serif;font-style:italic;color:var(--rose-d);display:block;margin-bottom:.25rem;font-size:1.05rem;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;z-index:950;background:rgba(40,20,5,.93);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s;}
.lightbox.open{opacity:1;pointer-events:all;}
.lightbox-img{max-width:90vw;max-height:84vh;border-radius:22px;box-shadow:0 32px 80px rgba(0,0,0,.5);object-fit:contain;transform:scale(.94);transition:transform .45s cubic-bezier(.22,1,.36,1);}
.lightbox.open .lightbox-img{transform:none;}
.lightbox-close,.lightbox-nav{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(253,248,238,.12);border:1px solid rgba(253,248,238,.3);color:white;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s;}
.lightbox-close{top:1.5rem;right:1.5rem;}
.lightbox-close:hover{background:var(--rose-d);transform:rotate(90deg);}
.lightbox-nav{top:50%;transform:translateY(-50%);font-size:1.6rem;}
.lightbox-nav:hover{background:var(--rose-d);}
.lightbox-prev{left:1.5rem;}
.lightbox-next{right:1.5rem;}
.lightbox-caption{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);color:#FDF8EE;font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;background:rgba(61,32,7,.6);padding:.55rem 1.2rem;border-radius:50px;white-space:nowrap;}

/* DEEL-BAND */
.deel{margin-top:3rem;background:var(--espresso);border-radius:24px;padding:2.5rem 3rem;display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap;box-shadow:0 8px 40px rgba(61,32,7,.22);}
.deel-txt{font-family:'Playfair Display',serif;font-size:1.25rem;font-style:italic;color:rgba(253,248,238,.8);flex:1;min-width:220px;}
.deel-txt strong{color:var(--rose);font-style:normal;}
.deel-btns{display:flex;gap:.75rem;flex-wrap:wrap;}
.deel-btn{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;letter-spacing:.04em;color:white;padding:.88rem 1.7rem;border-radius:50px;text-decoration:none;transition:opacity .2s,transform .15s;white-space:nowrap;}
.deel-btn:hover{opacity:.88;transform:translateY(-2px);}
.deel-btn.wa-b{background:#25D366;}
.deel-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#bc1888);}

@media(max-width:900px){.gallery-grid{columns:2;}.deel{flex-direction:column;text-align:center;padding:2rem;}.deel-btns{justify-content:center;}}
@media(max-width:540px){.gallery-grid{columns:1;}.lightbox-nav{display:none;}}
</style>
</head>
<body>
<script src="assets/site.js"></script>

<header class="page-hero" style="--ph-img:url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1800&q=85');">
  <div class="ph-bg"></div><div class="ph-mid"></div>
  <div class="ph-inner">
    <a href="index.html" class="back-link">← Terug naar home</a><br>
    <div class="ph-badge"><div class="badge-dot"></div>Sfeer &amp; beleving</div>
    <h1 class="ph-title">
      <span class="ph-word" style="animation-delay:.3s;">Onze</span> <span class="ph-word" style="animation-delay:.42s;">mooiste</span>
      <span class="ph-word script" style="animation-delay:.54s;">momenten</span>
    </h1>
    <p class="ph-desc">Van zonnige yogasessies tot een verse smoothie aan de bar — zo voelt het bij La Vie en Rose.</p>
  </div>
</header>
<div class="morph-divider"><svg viewBox="0 0 1440 80" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path id="wavePath" d="M0,40 C240,80 480,0 720,40 C960,80 1200,0 1440,40 L1440,80 L0,80 Z" fill="#FDF8EE"/></svg></div>

<main>
  <section class="sec">
    <div class="blob" style="width:420px;height:420px;top:-60px;right:-160px;background:rgba(232,164,160,.14);"></div>
    <div class="inner">
      <div class="filter-bar sr up">
        <span class="filter-lbl">Filter</span>
        <button class="filter-btn active" onclick="setFilter('all',this)">Alles</button>
        <button class="filter-btn" onclick="setFilter('sportruimte',this)">Sportruimte</button>
        <button class="filter-btn" onclick="setFilter('bar',this)">Bar</button>
        <button class="filter-btn" onclick="setFilter('lessen',this)">Lessen</button>
        <button class="filter-btn" onclick="setFilter('sfeer',this)">Sfeer</button>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>

      <div class="deel sr scale">
        <p class="deel-txt">Ben je bij ons geweest? <strong>Deel jouw moment</strong> — we plaatsen je foto's graag in de galerij.</p>
        <div class="deel-btns">
          <a href="https://wa.me/32471955489" target="_blank" rel="noopener" class="deel-btn wa-b">📲 Via WhatsApp</a>
          <a href="https://instagram.com/lavieenrose.aalst" target="_blank" rel="noopener" class="deel-btn ig">📷 Tag @lavieenrose.aalst</a>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightboxBtn()" aria-label="Sluiten">✕</button>
  <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1,event)" aria-label="Vorige">&#8249;</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <button class="lightbox-nav lightbox-next" onclick="navLightbox(1,event)" aria-label="Volgende">&#8250;</button>
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
// Fotodata — vervang src door je eigen foto's wanneer je ze hebt.
var photos=[
  {src:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=800&q=80',caption:'Onze sportruimte',tag:'sportruimte'},
  {src:'https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=800&q=80',caption:'Yogales',tag:'lessen'},
  {src:'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800&q=80',caption:'Sfeer in de zaal',tag:'sportruimte'},
  {src:'https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=800&q=80',caption:'Onze verse smoothies',tag:'bar'},
  {src:'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=800&q=80',caption:'Kinesitherapie',tag:'lessen'},
  {src:'https://images.unsplash.com/photo-1554284126-aa88f22d8b74?w=800&q=80',caption:'Personal training',tag:'lessen'},
  {src:'https://images.unsplash.com/photo-1445116572660-236099ec97a0?w=800&q=80',caption:'Na het sporten aan de bar',tag:'bar'},
  {src:'https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=800&q=80',caption:'Gezellige sfeer',tag:'sfeer'},
  {src:'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=800&q=80',caption:'Trainingsruimte',tag:'sportruimte'},
  {src:'https://images.unsplash.com/photo-1559234935-7c2d2e7c1c0e?w=800&q=80',caption:'Cold brew klaarmaken',tag:'bar'},
  {src:'https://images.unsplash.com/photo-1588286840104-8957b019727f?w=800&q=80',caption:'Yogagroep',tag:'lessen'},
  {src:'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?w=800&q=80',caption:'Ons team',tag:'sfeer'},
  // Lege plekken voor je eigen foto's
  {placeholder:true,tag:'sportruimte',label:'Sportruimte',desc:'Deel jouw foto van de sportruimte'},
  {placeholder:true,tag:'bar',label:'Bar',desc:'Deel een foto van onze bar'},
  {placeholder:true,tag:'sfeer',label:'Sfeer',desc:'Jouw favoriete moment'}
];
var currentFilter='all',lightboxIndex=0;

function zichtbaar(){return photos.filter(function(p){return currentFilter==='all'||p.tag===currentFilter;});}
function echteFotos(){return zichtbaar().filter(function(p){return !p.placeholder;});}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderGallery();
}

function renderGallery(){
  var fotoNr=0;
  document.getElementById('galleryGrid').innerHTML=zichtbaar().map(function(p,i){
    var d='style="animation-delay:'+(i*0.06)+'s"';
    if(p.placeholder){
      return '<div class="gallery-placeholder" '+d+' onclick="showToast(\'Stuur je foto via WhatsApp of Instagram! 🌹\')">'+
        '<div class="gallery-placeholder-icon">📷</div><div class="gallery-placeholder-text"><strong>'+p.label+'</strong>'+p.desc+'</div></div>';
    }
    return '<div class="gallery-item" '+d+' onclick="openLightbox('+(fotoNr++)+')">'+
      '<img src="'+p.src+'" alt="'+p.caption+'" loading="lazy">'+
      '<div class="gallery-item-overlay"><div><div class="gallery-item-tag">'+p.tag+'</div><div class="gallery-item-caption">'+p.caption+'</div></div></div></div>';
  }).join('');
}

function openLightbox(idx){
  lightboxIndex=idx;toonFoto();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}
function toonFoto(){
  var p=echteFotos()[lightboxIndex];if(!p)return;
  document.getElementById('lightboxImg').src=p.src;
  document.getElementById('lightboxCaption').textContent=p.caption+' · '+p.tag;
}
function navLightbox(dir,e){
  if(e)e.stopPropagation();
  var n=echteFotos().length;
  lightboxIndex=(lightboxIndex+dir+n)%n;toonFoto();
}
function closeLightbox(e){if(e.target===document.getElementById('lightbox'))closeLightboxBtn();}
function closeLightboxBtn(){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLightboxBtn();
  if(e.key==='ArrowLeft')navLightbox(-1);
  if(e.key==='ArrowRight')navLightbox(1);
});

renderGallery();
</script>
</body>
</html>
